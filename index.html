<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Stories for All Ages</title>
<meta name="description" content="Bible story quizzes for families and Sunday school: read-aloud questions, flashcards, and challenges that work offline.">
<meta name="theme-color" content="#2A1650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bible Stories">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236B3FA0'/%3E%3Cpath d='M12 20c7-3 14-3 20 1v28c-6-4-13-4-20-1z' fill='%23F4EEFB'/%3E%3Cpath d='M52 20c-7-3-14-3-20 1v28c6-4 13-4 20-1z' fill='%23E4D6F7'/%3E%3Cpath d='M32 8v14M26 13h12' stroke='%23F2C14E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy:#2A1650; --blue:#6B3FA0; --green:#7E4FC4; --green-bright:#F2C14E;
  --bg:#F7F3FC; --surface:#FFFFFF; --surface-2:#EFE7F9; --border:#DCCFEE;
  --text:#1E1433; --muted:#6A5C80; --accent:var(--blue); --accent-ink:#FFFFFF;
  --ok:#1E8E57; --ok-bg:#E3F5EC; --bad:#C0392B; --bad-bg:#FBE7E4; --warn:#B7791F; --warn-bg:#FDF3DF;
  --radius:14px; --shadow:0 1px 2px rgba(11,31,58,.06),0 4px 16px rgba(11,31,58,.06);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-head:"Montserrat","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140C24; --surface:#1E1433; --surface-2:#2A1D45; --border:#3B2B5E;
    --text:#F1EAFB; --muted:#B3A5CC; --accent:#C3A6F0; --accent-ink:#1A0F2E;
    --ok:#4ADE95; --ok-bg:#0F3325; --bad:#FF7A6B; --bad-bg:#3A1714; --warn:#F6C35B; --warn-bg:#3A2C0C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#140C24; --surface:#1E1433; --surface-2:#2A1D45; --border:#3B2B5E;
  --text:#F1EAFB; --muted:#B3A5CC; --accent:#C3A6F0; --accent-ink:#1A0F2E;
  --ok:#4ADE95; --ok-bg:#0F3325; --bad:#FF7A6B; --bad-bg:#3A1714; --warn:#F6C35B; --warn-bg:#3A2C0C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:17px/1.6 var(--font);-webkit-text-size-adjust:100%;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-head);line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.25rem 0 .75rem}
small,.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .35em;border-radius:6px}
pre{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}

/* ============ LAYOUT ============ */
.app-header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand-row{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.brand-logo{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:1.1rem;letter-spacing:.2px}
.brand-tag{font-size:.75rem;opacity:.75;display:block;line-height:1.2}
.net{margin-left:auto;font-size:.72rem;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.net.off{background:#B7791F}
nav.tabs{display:flex;gap:4px;max-width:960px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.75);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.92rem}
nav.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--green-bright)}
main{max-width:960px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin-bottom:.25rem}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--text);min-height:40px}
@media (hover:hover){.btn:hover{background:var(--surface-2)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.08)}}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:42px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:6px 0}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.help{font-size:.82rem;color:var(--muted);margin-top:4px}
details{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}

/* ============ QUIZ ============ */
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green-bright));transition:width .25s}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.q-prompt{font-size:1.06rem;white-space:pre-wrap;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-size:.98rem;line-height:1.45}
@media (hover:hover){.opt:hover{border-color:var(--accent)}}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--surface-2);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt.sel .key{background:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
.feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
.feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
.feedback h3{margin:0 0 6px}
.sources{margin:8px 0 0;padding-left:18px;font-size:.88rem}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem;position:relative}
.navgrid button.ans{background:var(--surface-2);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.navgrid button.r-ok{background:var(--ok-bg);border-color:var(--ok)} .navgrid button.r-bad{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--mono);font-weight:700;font-size:1.05rem;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.score-ring{font-family:var(--font-head);font-size:2.6rem;font-weight:800}
.bar{display:grid;grid-template-columns:minmax(110px,1.2fr) 3fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.bar .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ok)}
.bar .track i.mid{background:var(--warn)} .bar .track i.low{background:var(--bad)}

/* flashcards */
.flash{perspective:1200px;min-height:280px;cursor:pointer}
.flash-inner{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow:auto;box-shadow:var(--shadow)}
.flash-back{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.flash-inner{transition:none}}

/* library */
.file-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.file-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:.7rem;font-weight:800;flex:none;color:var(--muted)}
.file-row .grow{flex:1;min-width:0}
.file-row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:26px 16px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--surface-2);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(5,12,24,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--text);border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.preview-media{max-width:100%;max-height:65vh;display:block;margin:0 auto;border-radius:10px}
.preview-frame{width:100%;height:65vh;border:1px solid var(--border);border-radius:10px;background:#fff}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:.92rem}
.toast.bad{background:#8E2A20}
.empty{text-align:center;padding:36px 16px}
.kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.hide{display:none!important}
.menu{position:relative;display:inline-block}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:190px;z-index:30;padding:6px}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--surface-2)}
footer.foot{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:560px){ nav.tabs{gap:0} nav.tabs button{flex:1 0 auto;padding:10px 7px;font-size:.84rem}  h1{font-size:1.3rem} .card{padding:14px} .bar{grid-template-columns:1fr 2fr 44px} }
@media (max-width:370px){ .hide-xs{display:none} nav.tabs button{padding:10px 5px;font-size:.8rem} }
@media print{ .app-header,nav,footer,.btn{display:none!important} body{background:#fff;color:#000} }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand-row">
    <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#6B3FA0"/><path d="M12 20c7-3 14-3 20 1v28c-6-4-13-4-20-1z" fill="#F4EEFB"/><path d="M52 20c-7-3-14-3-20 1v28c6-4 13-4 20-1z" fill="#E4D6F7"/><path d="M32 8v14M26 13h12" stroke="#F2C14E" stroke-width="4" stroke-linecap="round"/></svg>
    <div><span class="brand-name" id="brandName">Bible Stories for All Ages</span><span class="brand-tag" id="brandTag"></span></div>
    <span class="net" id="netStatus" role="status">Online</span>
  </div>
  <nav class="tabs" aria-label="Main">
    <button data-act="nav" data-view="decks">Decks</button>
    <button data-act="nav" data-view="library">Library</button>
    <button data-act="nav" data-view="import">Import</button>
    <button data-act="nav" data-view="ai">AI<span class="hide-xs"> Builder</span></button>
    <button data-act="nav" data-view="settings">Settings</button>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot" id="foot"></footer>
<div id="toast" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="hiddenFile" class="hide" multiple>

<script>
"use strict";
/* =====================================================================
   BRANDING — edit these values to rebrand or resell the app.
   ===================================================================== */
const BRAND = {
  name: "Bible Stories for All Ages",
  tagline: "Thy word have I hid in mine heart. (Psalm 119:11)",
  byline: "by AnalyticsByShanikwa",
  url: "https://analyticsbyshanikwa.com",
  support: "hello@analyticsbyshanikwa.com",
  version: "1.2.1",
  examLabel: "Timed challenge",
  correctMsg: "Great job! 🎉",
  courseWord: "Group",
  courseExample: "e.g., Sunday School Grades 3–5",
  deckExample: "e.g., The Life of Moses (Ages 9–12)",
  focusExample: "e.g., Ages 5–8, simple words, 3 choices, a hint on every question",
  scenarioLabel: "Story-based questions (recommended)",
  speechRate: 0.92,
  autoSeed: true,
  sampleButton: "Load the 60 starter Bible stories"
};
const APP_ID = "bible-stories-all-ages";

/* ============ UTILITIES ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (p = "id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LETTERS = "ABCDEFGHIJ";
const fmtBytes = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : b < 1073741824 ? (b/1048576).toFixed(1) + " MB" : (b/1073741824).toFixed(2) + " GB";
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
function toast(msg, bad = false, ms = 3200) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toast").appendChild(t); setTimeout(() => t.remove(), ms);
}
function download(name, data, type = "application/json") {
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const readAs = (file, how) => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error);
  how === "text" ? r.readAsText(file) : how === "dataurl" ? r.readAsDataURL(file) : r.readAsArrayBuffer(file);
});
const slug = s => String(s || "deck").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "deck";

/* ============ MODAL ============ */
let modalResolve = null;
function openModal(html, {wide = false} = {}) {
  $("#modalRoot").innerHTML = `<div class="modal-back" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" style="${wide ? "max-width:900px" : ""}">${html}</div></div>`;
  const first = $("#modalRoot .modal input, #modalRoot .modal textarea, #modalRoot .modal select, #modalRoot .modal button");
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal(val) {
  $("#modalRoot").innerHTML = "";
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(val); }
}
function confirmBox(title, body, okLabel = "Confirm", danger = false) {
  return new Promise(res => {
    modalResolve = res;
    openModal(`<h2>${esc(title)}</h2><p>${body}</p><div class="actions"><button class="btn" data-act="modal-close" data-val="0">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-act="modal-close" data-val="1">${esc(okLabel)}</button></div>`);
  });
}

/* ============ STORAGE (IndexedDB with in-memory fallback) ============ */
const DB = {
  db: null, mem: {decks:{}, progress:{}, files:{}, kv:{}}, ok: true,
  open() {
    return new Promise(res => {
      try {
        const req = indexedDB.open(APP_ID, 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          ["decks","progress","files","kv"].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: "id"}); });
        };
        req.onsuccess = () => { this.db = req.result; res(true); };
        req.onerror = () => { this.ok = false; res(false); };
      } catch (e) { this.ok = false; res(false); }
    });
  },
  tx(store, mode, fn) {
    if (!this.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), s = t.objectStore(store); const r = fn(s);
      t.oncomplete = () => res(r && "result" in r ? r.result : r); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(store, id) { if (!this.db) return this.mem[store][id]; return this.tx(store, "readonly", s => s.get(id)); },
  async put(store, val) { if (!this.db) { this.mem[store][val.id] = val; return; } return this.tx(store, "readwrite", s => s.put(val)); },
  async del(store, id) { if (!this.db) { delete this.mem[store][id]; return; } return this.tx(store, "readwrite", s => s.delete(id)); },
  async all(store) { if (!this.db) return Object.values(this.mem[store]); return this.tx(store, "readonly", s => s.getAll()); },
  async clear(store) { if (!this.db) { this.mem[store] = {}; return; } return this.tx(store, "readwrite", s => s.clear()); }
};

/* ============ STATE ============ */
const DEFAULT_SETTINGS = {
  id: "settings", theme: "auto", secPerQ: 90, passPct: 80, shuffleQ: true, shuffleOpts: false,
  appName: "", tagline: "", provider: "anthropic", apiKey: "", model: "", baseUrl: "", rememberKey: true
};
const S = { view: "decks", decks: [], progress: {}, settings: {...DEFAULT_SETTINGS}, session: null, lastResult: null, timer: null, editDeckId: null, statsDeckId: null, deferredInstall: null };

async function loadAll() {

}

function getProg(deckId) { if (!S.progress[deckId]) S.progress[deckId] = {id: deckId, q: {}, attempts: []}; return S.progress[deckId]; }
const saveProg = deckId => DB.put("progress", getProg(deckId));
async function saveDeck(deck) { deck.updated = Date.now(); await DB.put("decks", deck); const i = S.decks.findIndex(d => d.id === deck.id); if (i >= 0) S.decks[i] = deck; else S.decks.unshift(deck); }

/* ============ QUESTION NORMALIZATION & PARSERS ============ */
function normQuestion(q, i) {
  if (!q || typeof q !== "object") return null;
  const prompt = q.prompt ?? q.question ?? q.stem ?? q.text ?? q.q ?? "";
  let opts = q.options ?? q.choices ?? q.answers_list ?? q.answerOptions ?? [];
  if (!Array.isArray(opts) && typeof opts === "object") opts = Object.entries(opts).map(([k, v]) => ({id: k, text: v}));
  opts = (opts || []).map((o, k) => typeof o === "string"
    ? {id: LETTERS[k].toLowerCase(), text: o.replace(/^\s*[A-Ja-j][).:]\s+/, "")}
    : {id: String(o.id ?? o.key ?? o.letter ?? LETTERS[k]).toLowerCase(), text: String(o.text ?? o.label ?? o.value ?? "")})
    .filter(o => o.text.trim() !== "");
  if (!String(prompt).trim() || opts.length < 2) return null;
  let ans = q.answers ?? q.answer ?? q.correct ?? q.correct_option_id ?? q.correctAnswer ?? q.correct_answer ?? q.key;
  if (!Array.isArray(ans)) ans = ans == null ? [] : String(ans).split(/[,;|&]| and /i).map(s => s.trim()).filter(Boolean);
  ans = ans.map(a => {
    if (typeof a === "number") return opts[a] ? opts[a].id : null;
    const s = String(a).trim();
    const byId = opts.find(o => o.id === s.toLowerCase()); if (byId) return byId.id;
    const m = s.match(/^([A-Ja-j])(?:[).:]|$)/); if (m) { const k = LETTERS.indexOf(m[1].toUpperCase()); if (opts[k]) return opts[k].id; }
    if (/^\d+$/.test(s)) { const k = +s - 1; if (opts[k]) return opts[k].id; }
    const byText = opts.find(o => o.text.trim().toLowerCase() === s.toLowerCase()); return byText ? byText.id : null;
  }).filter(Boolean);
  if (!ans.length) return null;
  let src = q.sources ?? q.source ?? q.references ?? q.citation ?? [];
  if (!Array.isArray(src)) src = String(src).split(/\s*;\s*|\n/).filter(Boolean);
  let tags = q.tags ?? []; if (!Array.isArray(tags)) tags = String(tags).split(/[,;]/).map(s => s.trim()).filter(Boolean);
  return {
    id: String(q.id ?? "q" + (i + 1)), topic: String(q.topic ?? q.category ?? q.chapter ?? q.section ?? "General").trim() || "General",
    prompt: String(prompt).trim(), options: opts, answer: [...new Set(ans)],
    explanation: String(q.explanation ?? q.rationale ?? q.feedback ?? "").trim(), sources: src.map(String),
    hint: String(q.hint ?? "").trim(), tags
  };
}
function buildDeck(meta, rawQs, fallbackTitle) {
  const seen = new Set(); const qs = [];
  rawQs.forEach((r, i) => { const q = normQuestion(r, i); if (!q) return; let id = q.id; while (seen.has(id)) id = id + "_" + i; seen.add(id); q.id = id; qs.push(q); });
  meta = meta || {};
  return { id: uid("deck"), title: String(meta.title || fallbackTitle || "Imported deck").trim(), course: String(meta.course || "").trim(),
    description: String(meta.description || "").trim(), sources: Array.isArray(meta.sources) ? meta.sources.map(String) : meta.sources ? [String(meta.sources)] : [],
    questions: qs, created: Date.now(), updated: Date.now() };
}
function parseJSONDeck(obj, fallbackTitle) {
  if (Array.isArray(obj)) return [buildDeck({}, obj, fallbackTitle)];
  if (obj && obj.format === "faithful-study-backup") throw new Error("This is a full backup. Use Settings → Restore backup.");
  if (obj && Array.isArray(obj.decks)) return obj.decks.map(d => parseJSONDeck(d, fallbackTitle)[0]);
  const meta = obj.deck || {title: obj.title, course: obj.course, description: obj.description, sources: obj.sources};
  const qs = obj.questions || obj.items || obj.quiz || [];
  return [buildDeck(meta, qs, fallbackTitle)];
}
function parseCSVRows(text) {
  const rows = []; let row = [], f = "", q = false; const d = text.includes("\t") && !text.split("\n")[0].includes(",") ? "\t" : ",";
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function parseCSVDeck(text, fallbackTitle) {
  const rows = parseCSVRows(text); if (rows.length < 2) throw new Error("CSV needs a header row and at least one question.");
  const H = rows[0].map(h => h.trim().toLowerCase());
  const col = (...names) => H.findIndex(h => names.includes(h));
  const cQ = col("question","prompt","stem"), cAns = col("answer","correct","correct answer","key"), cExp = col("explanation","rationale"),
        cSrc = col("source","sources","reference","references"), cTop = col("topic","chapter","category","section"), cHint = col("hint"), cTags = col("tags","tag");
  const optCols = H.map((h, i) => /^(option\s*)?[a-j]$|^choice\s*[a-j1-9]$|^option\s*[1-9]$/.test(h) ? i : -1).filter(i => i >= 0);
  if (cQ < 0 || cAns < 0 || optCols.length < 2) throw new Error("CSV header needs: question, A, B (C, D…), answer. Optional: topic, explanation, source, hint, tags.");
  const qs = rows.slice(1).map(r => ({ prompt: r[cQ], options: optCols.map(i => r[i] || "").filter(s => s.trim()),
    answer: r[cAns], explanation: cExp >= 0 ? r[cExp] : "", sources: cSrc >= 0 ? r[cSrc] : "", topic: cTop >= 0 ? r[cTop] : "General",
    hint: cHint >= 0 ? r[cHint] : "", tags: cTags >= 0 ? r[cTags] : "" }));
  return [buildDeck({title: fallbackTitle}, qs, fallbackTitle)];
}
function parseTextDeck(text, fallbackTitle) {
  const lines = text.replace(/\r/g, "").split("\n"); const qs = []; let cur = null, field = null; let meta = {};
  const push = () => { if (cur) qs.push(cur); cur = null; field = null; };
  for (let raw of lines) {
    const line = raw.trim();
    let m;
    if ((m = line.match(/^#\s*(?:deck|title)\s*:\s*(.+)$/i))) { meta.title = m[1]; continue; }
    if ((m = line.match(/^#\s*course\s*:\s*(.+)$/i))) { meta.course = m[1]; continue; }
    if ((m = line.match(/^(?:Q(?:uestion)?\s*\d*\s*[:.)]|\*{0,2}\d{1,3}[.)]\*{0,2})\s*(.*)$/i))) { push(); cur = {prompt: m[1], options: [], answer: [], explanation: "", sources: [], topic: "", hint: ""}; field = "prompt"; continue; }
    if (!cur) continue;
    if ((m = line.match(/^(\*?)\s*-?\s*\(?([A-Ja-j])[).:]\s+(.*?)(\s*\*)?\s*$/)) && field !== "explanation") {
      const letter = m[2].toUpperCase(); let txt = m[3]; const star = m[1] === "*" || !!m[4] || /\((?:correct|answer)\)$/i.test(txt);
      txt = txt.replace(/\s*\((?:correct|answer)\)$/i, "");
      cur.options.push(txt); if (star) cur.answer.push(letter); field = "opt"; continue;
    }
    if ((m = line.match(/^(?:answer|correct(?: answer)?|key)\s*[:=]\s*(.+)$/i))) { cur.answer = m[1].split(/[,;\s]+/).filter(Boolean); field = null; continue; }
    if ((m = line.match(/^(?:explanation|rationale|why)\s*[:=]\s*(.*)$/i))) { cur.explanation = m[1]; field = "explanation"; continue; }
    if ((m = line.match(/^(?:sources?|references?|citation)\s*[:=]\s*(.*)$/i))) { cur.sources = m[1].split(/\s*;\s*/).filter(Boolean); field = "sources"; continue; }
    if ((m = line.match(/^(?:topic|chapter|category)\s*[:=]\s*(.*)$/i))) { cur.topic = m[1]; field = null; continue; }
    if ((m = line.match(/^hint\s*[:=]\s*(.*)$/i))) { cur.hint = m[1]; field = null; continue; }
    if (!line) { if (field === "prompt") cur.prompt += "\n"; continue; }
    if (field === "prompt") cur.prompt += (cur.prompt && !cur.prompt.endsWith("\n") ? " " : "") + line;
    else if (field === "explanation") cur.explanation += " " + line;
    else if (field === "sources") cur.sources.push(line);
  }
  push();
  if (!qs.length) throw new Error("No questions found. Start each question with “Q:” or “1.”, list options as “A) …”, and add “Answer: B”.");
  qs.forEach(q => q.prompt = q.prompt.trim());
  return [buildDeck({...meta, title: meta.title || fallbackTitle}, qs, fallbackTitle)];
}
function parseAny(text, filename = "") {
  const base = filename.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim() || "Imported deck";
  const t = text.trim();
  if (/\.json$/i.test(filename) || t.startsWith("{") || t.startsWith("[")) {
    let obj; try { obj = JSON.parse(t); } catch (e) {
      const s = t.indexOf("{"), e2 = t.lastIndexOf("}"); if (s >= 0 && e2 > s) obj = JSON.parse(t.slice(s, e2 + 1)); else throw new Error("That JSON couldn’t be read: " + e.message);
    }
    return parseJSONDeck(obj, base);
  }
  const fenced = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fenced && fenced[1].trim().startsWith("{")) return parseJSONDeck(JSON.parse(fenced[1]), base);
  if (/\.(csv|tsv)$/i.test(filename) || /^[^\n]*\bquestion\b[^\n]*[,\t][^\n]*\banswer\b/i.test(t)) return parseCSVDeck(t, base);
  return parseTextDeck(t, base);
}
function deckToJSON(d) {
  return JSON.stringify({format: "studyquiz/v1", deck: {title: d.title, course: d.course, description: d.description, sources: d.sources},
    questions: d.questions.map(q => { const o = {id: q.id, topic: q.topic, prompt: q.prompt, options: q.options}; if (q.answer.length > 1) o.answers = q.answer; else o.answer = q.answer[0];
      o.explanation = q.explanation; o.sources = q.sources; if (q.hint) o.hint = q.hint; if (q.tags?.length) o.tags = q.tags; return o; })}, null, 2);
}
function deckToCSV(d) {
  const n = Math.max(...d.questions.map(q => q.options.length), 4);
  const cell = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
  const head = ["topic","question",...LETTERS.slice(0, n).split(""),"answer","explanation","source","hint","tags"];
  const rows = d.questions.map(q => [q.topic, q.prompt, ...Array.from({length: n}, (_, k) => q.options[k]?.text || ""),
    q.answer.map(a => LETTERS[q.options.findIndex(o => o.id === a)]).join(","), q.explanation, q.sources.join("; "), q.hint || "", (q.tags || []).join(",")]);
  return [head, ...rows].map(r => r.map(v => cell(String(v ?? ""))).join(",")).join("\n");
}

/* ============ PROGRESS / MASTERY ============ */
function qStat(deckId, qid) { const p = getProg(deckId); return p.q[qid] || (p.q[qid] = {seen: 0, right: 0, wrong: 0, last: null, streak: 0, box: 1}); }
function record(deckId, q, correct) {
  const s = qStat(deckId, q.id); s.seen++; s.last = !!correct; s.at = Date.now();
  if (correct) { s.right++; s.streak++; s.box = Math.min(5, s.box + 1); } else { s.wrong++; s.streak = 0; s.box = 1; }
}
const isWeak = (deckId, q) => { const s = getProg(deckId).q[q.id]; return !!s && s.seen > 0 && (s.last === false || s.wrong > s.right); };
const isMastered = (deckId, q) => { const s = getProg(deckId).q[q.id]; return !!s && s.streak >= 2; };
function deckSummary(d) {
  const total = d.questions.length, p = getProg(d.id);
  const seen = d.questions.filter(q => p.q[q.id]?.seen).length, mastered = d.questions.filter(q => isMastered(d.id, q)).length, weak = d.questions.filter(q => isWeak(d.id, q)).length;
  const last = p.attempts.filter(a => a.mode === "exam").slice(-1)[0];
  return {total, seen, mastered, weak, last, attempts: p.attempts.length};
}
function topicStats(d) {
  const m = {}; const p = getProg(d.id);
  d.questions.forEach(q => { const t = m[q.topic] || (m[q.topic] = {topic: q.topic, total: 0, right: 0, wrong: 0, weak: 0}); t.total++; const s = p.q[q.id]; if (s) { t.right += s.right; t.wrong += s.wrong; if (isWeak(d.id, q)) t.weak++; } });
  return Object.values(m);
}
const isCorrect = (q, sel) => sel && sel.length === q.answer.length && sel.every(a => q.answer.includes(a));

/* ============ SESSION SETUP ============ */
function openSetup(deckId, mode, weakOnly = false) {
  const d = S.decks.find(x => x.id === deckId); if (!d) return;
  if (!d.questions.length) { toast("This deck has no questions yet. Add some in Edit questions."); return; }
  const topics = [...new Set(d.questions.map(q => q.topic))];
  const n = d.questions.length, label = {practice: "Practice", exam: BRAND.examLabel, flash: "Flashcards"}[mode];
  openModal(`<h2>${label}: ${esc(d.title)}</h2>
    <form id="setupForm" data-deck="${d.id}" data-mode="${mode}">
      <div class="field"><label for="sCount">Number of questions (max ${n})</label><input id="sCount" type="number" min="1" max="${n}" value="${n}"></div>
      ${mode === "exam" ? `<div class="field"><label for="sMin">Time limit (minutes)</label><input id="sMin" type="number" min="1" value="${Math.ceil(n * S.settings.secPerQ / 60)}"><p class="help">Default is ${S.settings.secPerQ} seconds per question. Change it in Settings.</p></div>` : ""}
      ${topics.length > 1 ? `<fieldset class="field" style="border:0;padding:0"><legend style="font-weight:600;font-size:.9rem;margin-bottom:4px">Topics</legend>
        ${topics.map((t, i) => `<label class="check"><input type="checkbox" name="topic" value="${esc(t)}" checked> ${esc(t)} <span class="muted">(${d.questions.filter(q => q.topic === t).length})</span></label>`).join("")}</fieldset>` : ""}
      <label class="check"><input type="checkbox" id="sWeak" ${weakOnly ? "checked" : ""}> Only weak spots (questions you last missed or miss more often than you get right)</label>
      <label class="check"><input type="checkbox" id="sShufQ" ${S.settings.shuffleQ ? "checked" : ""}> Shuffle question order</label>
      <label class="check"><input type="checkbox" id="sShufO" ${S.settings.shuffleOpts ? "checked" : ""}> Shuffle answer choices <span class="muted">(explanations that mention letters may not match)</span></label>
      <div class="actions"><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Start</button></div>
    </form>`);
}
function startSession(form) {
  const d = S.decks.find(x => x.id === form.dataset.deck), mode = form.dataset.mode;
  const topics = [...form.querySelectorAll("input[name=topic]")].filter(c => c.checked).map(c => c.value);
  let qs = d.questions.filter(q => !topics.length || form.querySelectorAll("input[name=topic]").length === 0 || topics.includes(q.topic));
  if ($("#sWeak").checked) qs = qs.filter(q => isWeak(d.id, q));
  if (!qs.length) { toast("No questions match those filters.", true); return; }
  if ($("#sShufQ").checked) qs = shuffle(qs);
  const count = Math.max(1, Math.min(qs.length, +$("#sCount").value || qs.length)); qs = qs.slice(0, count);
  const shufO = $("#sShufO").checked;
  qs = qs.map(q => ({...q, options: shufO ? shuffle(q.options) : q.options}));
  const mins = mode === "exam" ? Math.max(1, +($("#sMin")?.value) || 1) : 0;
  closeModal();
  S.session = {deckId: d.id, deckTitle: d.title, mode, qs, i: 0, ans: {}, checked: {}, flags: {}, hints: {}, start: Date.now(), limit: mins * 60, ended: false, flipped: false, known: 0, again: 0};
  S.view = "session"; render(); window.scrollTo(0, 0);
}

/* ============ SESSION VIEW ============ */
function renderSession() {
  const s = S.session; if (!s) return renderDecks();
  if (s.mode === "flash") return renderFlash();
  const q = s.qs[s.i], sel = s.ans[q.id] || [], multi = q.answer.length > 1, checked = s.mode === "practice" && s.checked[q.id];
  const optsHtml = q.options.map((o, k) => {
    let cls = sel.includes(o.id) ? "sel" : "";
    if (checked) cls = q.answer.includes(o.id) ? "correct" : sel.includes(o.id) ? "wrong" : "";
    return `<button class="opt ${cls}" data-act="pick" data-opt="${esc(o.id)}" ${checked ? "disabled" : ""} aria-pressed="${sel.includes(o.id)}"><span class="key">${LETTERS[k]}</span><span>${esc(o.text)}</span></button>`;
  }).join("");
  let fb = "";
  if (checked) {
    const ok = isCorrect(q, sel), right = q.answer.map(a => LETTERS[q.options.findIndex(o => o.id === a)]).join(", ");
    fb = `<div class="feedback ${ok ? "ok" : "bad"}" role="status">${canSpeak && q.explanation ? `<button class="btn sm ghost" style="float:right" data-act="speak-exp" aria-label="Read explanation aloud">🔊</button>` : ""}<h3>${ok ? esc(BRAND.correctMsg) : "Not quite. The answer is " + right + "."}</h3>
      ${q.explanation ? `<p style="white-space:pre-wrap">${esc(q.explanation)}</p>` : ""}
      ${q.sources.length ? `<strong style="font-size:.88rem">Sources</strong><ul class="sources">${q.sources.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`;
  }
  const answered = Object.keys(s.ans).filter(k => s.ans[k]?.length).length;
  const top = s.mode === "exam"
    ? `<div class="row between"><div><strong>${esc(s.deckTitle)}</strong><div class="muted" style="font-size:.85rem">${esc(BRAND.examLabel)} · ${answered}/${s.qs.length} answered</div></div>
        <div class="row"><span class="timer" id="timer">--:--</span><button class="btn sm" data-act="exam-grid">Questions</button><button class="btn sm primary" data-act="submit-exam">Submit</button></div></div>`
    : `<div class="row between"><div><strong>${esc(s.deckTitle)}</strong><div class="muted" style="font-size:.85rem">Practice · instant feedback</div></div><button class="btn sm" data-act="end-practice">Finish</button></div>`;
  return `<div class="card">${top}
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(s.i + 1, s.qs.length)}" aria-label="Progress" style="margin-top:12px"><i style="width:${pct(s.i + 1, s.qs.length)}%"></i></div>
    <div class="q-meta"><span class="pill">Question ${s.i + 1} of ${s.qs.length}</span><span class="pill">${esc(q.topic)}</span>${multi ? `<span class="pill warn">Select ${q.answer.length}</span>` : ""}${(q.tags || []).includes("weak-spot") ? `<span class="pill bad">★ weak spot</span>` : ""}
      ${canSpeak ? `<button class="btn sm ghost" data-act="speak" aria-label="Read question aloud">🔊 Read aloud</button>` : ""}
      ${s.mode === "exam" ? `<button class="btn sm ghost" data-act="flag" aria-pressed="${!!s.flags[q.id]}">${s.flags[q.id] ? "⚑ Flagged" : "⚐ Flag"}</button>` : ""}</div>
    <div class="q-prompt">${esc(q.prompt)}</div>
    <div class="opts" role="group" aria-label="Answer choices">${optsHtml}</div>
    ${q.hint && !checked && s.mode === "practice" ? (s.hints[q.id] ? `<p class="help" style="margin-top:10px">💡 ${esc(q.hint)}</p>` : `<button class="btn sm ghost" style="margin-top:8px" data-act="hint">Show hint</button>`) : ""}
    ${fb}
    <div class="row between" style="margin-top:16px">
      <button class="btn" data-act="prev" ${s.i === 0 ? "disabled" : ""}>← Back</button>
      <span class="muted" style="font-size:.8rem">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> pick · <span class="kbd">Enter</span> ${s.mode === "practice" ? "check/next" : "next"}</span>
      ${s.mode === "practice" && !checked ? `<button class="btn primary" data-act="check" ${sel.length ? "" : "disabled"}>Check answer</button>`
        : s.i < s.qs.length - 1 ? `<button class="btn primary" data-act="next">Next →</button>`
        : s.mode === "exam" ? `<button class="btn primary" data-act="submit-exam">Submit exam</button>` : `<button class="btn primary" data-act="end-practice">See results</button>`}
    </div></div>`;
}
function pick(optId) {
  const s = S.session, q = s.qs[s.i]; if (s.mode === "practice" && s.checked[q.id]) return;
  let sel = s.ans[q.id] || [];
  if (q.answer.length > 1) sel = sel.includes(optId) ? sel.filter(x => x !== optId) : [...sel, optId]; else sel = [optId];
  s.ans[q.id] = sel;
  if (s.mode === "practice" && q.answer.length === 1) { checkAnswer(); return; }
  render();
}
function checkAnswer() {
  const s = S.session, q = s.qs[s.i]; if (!(s.ans[q.id] || []).length || s.checked[q.id]) return;
  s.checked[q.id] = true; record(s.deckId, q, isCorrect(q, s.ans[q.id])); saveProg(s.deckId); render();
}
function move(delta) { stopSpeak(); const s = S.session; s.i = Math.max(0, Math.min(s.qs.length - 1, s.i + delta)); s.flipped = false; render(); window.scrollTo(0, 0); }

/* read-aloud */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function speakText(txt) { if (!canSpeak) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.rate = BRAND.speechRate || 1; speechSynthesis.speak(u); }
const speakQ = q => speakText(q.prompt + ". " + q.options.map((o, k) => `${LETTERS[k]}: ${o.text}`).join(". "));
const stopSpeak = () => { if (canSpeak) speechSynthesis.cancel(); };

/* exam timer */
function startTimer() {
  stopTimer(); const s = S.session; if (!s || s.mode !== "exam" || s.ended) return;
  const tick = () => { const left = s.limit - (Date.now() - s.start) / 1000; const t = $("#timer");
    if (t) { t.textContent = fmtTime(left); t.classList.toggle("low", left < 60); }
    if (left <= 0) { stopTimer(); toast("Time is up. Your exam was submitted."); finishSession(); } };
  tick(); S.timer = setInterval(tick, 1000);
}
function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function examGrid() {
  const s = S.session;
  openModal(`<h2>Jump to a question</h2><p class="muted">Blue = answered · dot = flagged</p><div class="navgrid">${s.qs.map((q, k) =>
    `<button class="${(s.ans[q.id] || []).length ? "ans" : ""} ${s.flags[q.id] ? "flag" : ""} ${k === s.i ? "cur" : ""}" data-act="goto" data-i="${k}" aria-label="Question ${k + 1}">${k + 1}</button>`).join("")}</div>
    <div class="actions"><button class="btn" data-act="modal-close">Close</button></div>`);
}
async function submitExam() {
  const s = S.session, un = s.qs.filter(q => !(s.ans[q.id] || []).length).length;
  if (un && !(await confirmBox("Submit exam?", `You have ${un} unanswered question${un > 1 ? "s" : ""}. Unanswered questions count as wrong.`, "Submit anyway"))) return;
  finishSession();
}
function finishSession() {
  const s = S.session; if (!s || s.ended) return; stopTimer(); s.ended = true;
  const d = S.decks.find(x => x.id === s.deckId);
  const items = s.qs.map(q => ({q, sel: s.ans[q.id] || [], ok: isCorrect(q, s.ans[q.id]), flag: !!s.flags[q.id]}));
  let graded = items;
  if (s.mode === "exam") items.forEach(it => record(s.deckId, it.q, it.ok));
  else graded = items.filter(it => s.checked[it.q.id]);
  const correct = graded.filter(i => i.ok).length, total = s.mode === "exam" ? items.length : graded.length;
  const byTopic = {}; graded.forEach(it => { const t = byTopic[it.q.topic] || (byTopic[it.q.topic] = {right: 0, total: 0}); t.total++; if (it.ok) t.right++; });
  const result = {date: Date.now(), mode: s.mode, correct, total, pct: pct(correct, total), secs: Math.round((Date.now() - s.start) / 1000), byTopic};
  if (total) { getProg(s.deckId).attempts.push(result); saveProg(s.deckId); }
  S.lastResult = {...result, items: s.mode === "exam" ? items : graded, deckId: s.deckId, deckTitle: d?.title || s.deckTitle, filter: "all"};
  S.session = null; S.view = "results"; render(); window.scrollTo(0, 0);
}

/* ============ RESULTS ============ */
function renderResults() {
  const r = S.lastResult; if (!r) return renderDecks();
  if (!r.total) return `<div class="card empty"><h2>No answers recorded</h2><p class="muted">Answer at least one question to see results.</p><button class="btn primary" data-act="nav" data-view="decks">Back to decks</button></div>`;
  const pass = r.pct >= S.settings.passPct;
  const bars = Object.entries(r.byTopic).sort((a, b) => a[1].right / a[1].total - b[1].right / b[1].total).map(([t, v]) => barRow(t, v.right, v.total)).join("");
  const list = r.items.filter(it => r.filter === "all" || (r.filter === "wrong" && !it.ok) || (r.filter === "flag" && it.flag));
  const review = list.map(it => {
    const k = r.items.indexOf(it) + 1, q = it.q;
    const opts = q.options.map((o, j) => { const c = q.answer.includes(o.id) ? "correct" : it.sel.includes(o.id) ? "wrong" : ""; return `<div class="opt ${c}" style="cursor:default"><span class="key">${LETTERS[j]}</span><span>${esc(o.text)}${it.sel.includes(o.id) ? " <em class='muted'>(your answer)</em>" : ""}</span></div>`; }).join("");
    return `<details ${it.ok ? "" : "open"}><summary>${it.ok ? "✅" : "❌"} Q${k}. ${esc(q.prompt.slice(0, 110))}${q.prompt.length > 110 ? "…" : ""}</summary>
      <div class="q-prompt" style="margin-top:10px">${esc(q.prompt)}</div><div class="opts">${opts}</div>
      ${q.explanation ? `<div class="feedback"><p style="white-space:pre-wrap;margin:0">${esc(q.explanation)}</p>${q.sources.length ? `<ul class="sources">${q.sources.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>` : ""}</details>`;
  }).join("");
  return `<div class="card" style="text-align:center">
      <p class="muted" style="margin:0">${esc(r.deckTitle)} · ${r.mode === "exam" ? esc(BRAND.examLabel) : "Practice"} · ${fmtTime(r.secs)}</p>
      <div class="score-ring" style="color:${pass ? "var(--ok)" : "var(--bad)"}">${r.pct}%</div>
      <p><strong>${r.correct} of ${r.total} correct</strong> · ${pass ? "At or above" : "Below"} your ${S.settings.passPct}% target</p>
      <div class="row" style="justify-content:center">
        <button class="btn green" data-act="weak" data-id="${r.deckId}">Drill weak spots</button>
        <button class="btn" data-act="setup" data-id="${r.deckId}" data-mode="${r.mode === "exam" ? "exam" : "practice"}">Retake</button>
        <button class="btn" data-act="stats" data-id="${r.deckId}">All stats</button>
        <button class="btn" data-act="nav" data-view="decks">Decks</button>
      </div></div>
    <div class="card" style="margin-top:14px"><h2>By topic</h2>${bars}</div>
    <div class="card" style="margin-top:14px"><div class="row between"><h2>Review</h2>
      <div class="row"><button class="btn sm ${r.filter === "all" ? "primary" : ""}" data-act="rfilter" data-f="all">All</button><button class="btn sm ${r.filter === "wrong" ? "primary" : ""}" data-act="rfilter" data-f="wrong">Missed</button>${r.mode === "exam" ? `<button class="btn sm ${r.filter === "flag" ? "primary" : ""}" data-act="rfilter" data-f="flag">Flagged</button>` : ""}</div></div>
      ${review || `<p class="muted">Nothing to show for this filter.</p>`}</div>`;
}
function barRow(label, right, total) { const p = pct(right, total); return `<div class="bar"><span>${esc(label)}</span><span class="track"><i class="${p < 60 ? "low" : p < 80 ? "mid" : ""}" style="width:${p}%"></i></span><strong>${p}%</strong></div>`; }

/* ============ FLASHCARDS ============ */
function renderFlash() {
  const s = S.session;
  if (s.i >= s.qs.length) return `<div class="card empty"><h2>Deck complete</h2><p>${s.known} known · ${s.again} to review again</p>
    <div class="row" style="justify-content:center"><button class="btn green" data-act="weak" data-id="${s.deckId}">Drill weak spots</button><button class="btn" data-act="setup" data-id="${s.deckId}" data-mode="flash">Go again</button><button class="btn" data-act="nav" data-view="decks">Decks</button></div></div>`;
  const q = s.qs[s.i], right = q.answer.map(a => { const k = q.options.findIndex(o => o.id === a); return `<strong>${LETTERS[k]}.</strong> ${esc(q.options[k].text)}`; }).join("<br>");
  return `<div class="row between" style="margin-bottom:10px"><strong>${esc(s.deckTitle)} · Flashcards</strong><span class="pill">${s.i + 1} / ${s.qs.length}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(s.i, s.qs.length)}" aria-label="Progress" style="margin-bottom:12px"><i style="width:${pct(s.i, s.qs.length)}%"></i></div>
    <div class="flash ${s.flipped ? "flipped" : ""}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      <div class="flash-inner" id="flashInner">
        <div class="flash-face"><span class="pill">${esc(q.topic)}</span><div class="q-prompt" style="margin-top:10px">${esc(q.prompt)}</div>
          <ol type="A" style="padding-left:22px">${q.options.map(o => `<li>${esc(o.text)}</li>`).join("")}</ol><p class="help">Tap or press Space to flip</p></div>
        <div class="flash-face flash-back"><span class="pill ok">Answer</span><p style="margin-top:10px">${right}</p>
          ${q.explanation ? `<p style="white-space:pre-wrap">${esc(q.explanation)}</p>` : ""}${q.sources.length ? `<ul class="sources">${q.sources.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>
      </div></div>
    <div class="row" style="justify-content:center;margin-top:14px">
      ${canSpeak ? `<button class="btn" data-act="speak-flash" aria-label="Read card aloud">🔊</button>` : ""}
      <button class="btn danger" data-act="flash-rate" data-ok="0">Again <span class="kbd">1</span></button>
      <button class="btn green" data-act="flash-rate" data-ok="1">Got it <span class="kbd">2</span></button>
      <button class="btn ghost" data-act="nav" data-view="decks">Exit</button></div>`;
}
function fitFlash() { const inner = $("#flashInner"); if (!inner) return; const h = Math.max(...[...inner.children].map(c => c.scrollHeight)); inner.style.minHeight = h + "px"; inner.parentElement.style.minHeight = h + "px"; }
function flashRate(ok) {
  stopSpeak(); const s = S.session, q = s.qs[s.i]; record(s.deckId, q, ok); saveProg(s.deckId);
  ok ? s.known++ : s.again++; s.i++; s.flipped = false;
  if (s.i >= s.qs.length) getProg(s.deckId).attempts.push({date: Date.now(), mode: "flash", correct: s.known, total: s.qs.length, pct: pct(s.known, s.qs.length), secs: Math.round((Date.now() - s.start) / 1000), byTopic: {}});
  render();
}

/* ============ STATS ============ */
function renderStats() {
  const d = S.decks.find(x => x.id === S.statsDeckId); if (!d) return renderDecks();
  const s = deckSummary(d), p = getProg(d.id), ts = topicStats(d);
  const bars = ts.map(t => barRow(`${t.topic} (${t.total})`, t.right, t.right + t.wrong)).join("");
  const missed = d.questions.map(q => ({q, st: p.q[q.id]})).filter(x => x.st && x.st.wrong).sort((a, b) => b.st.wrong - a.st.wrong).slice(0, 10);
  const att = p.attempts.slice().reverse().slice(0, 20).map(a => `<tr><td>${fmtDate(a.date)}</td><td>${{exam: esc(BRAND.examLabel), practice: "Practice", flash: "Flashcards"}[a.mode]}</td><td>${a.correct}/${a.total}</td><td><strong>${a.pct}%</strong></td><td>${fmtTime(a.secs)}</td></tr>`).join("");
  return `<div class="row between" style="margin-bottom:12px"><h1>${esc(d.title)}</h1><button class="btn sm" data-act="nav" data-view="decks">← Decks</button></div>
    <div class="grid">
      <div class="card"><h3>Mastery</h3><div class="score-ring">${pct(s.mastered, s.total)}%</div><p class="muted">${s.mastered} of ${s.total} answered right twice in a row</p></div>
      <div class="card"><h3>Coverage</h3><div class="score-ring">${pct(s.seen, s.total)}%</div><p class="muted">${s.seen} of ${s.total} questions attempted</p></div>
      <div class="card"><h3>Weak spots</h3><div class="score-ring" style="color:var(--bad)">${s.weak}</div><button class="btn sm green" data-act="weak" data-id="${d.id}" ${s.weak ? "" : "disabled"}>Drill them</button></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Accuracy by topic</h2>${bars || `<p class="muted">No answers yet.</p>`}</div>
    <div class="card" style="margin-top:14px"><h2>Most-missed questions</h2>${missed.length ? `<ol>${missed.map(m => `<li style="margin-bottom:6px">${esc(m.q.prompt.slice(0, 140))}${m.q.prompt.length > 140 ? "…" : ""} <span class="pill bad">missed ${m.st.wrong}×</span></li>`).join("")}</ol>` : `<p class="muted">None yet. Nice.</p>`}</div>
    <div class="card" style="margin-top:14px;overflow:auto"><h2>History</h2>${att ? `<table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr style="text-align:left"><th>Date</th><th>Mode</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody>${att}</tbody></table>` : `<p class="muted">No sessions yet.</p>`}</div>`;
}

/* ============ EDITOR ============ */
function renderEditor() {
  const d = S.decks.find(x => x.id === S.editDeckId); if (!d) return renderDecks();
  const rows = d.questions.map((q, k) => `<div class="file-row"><div class="file-ico">${k + 1}</div><div class="grow"><div class="name">${esc(q.prompt)}</div><div class="muted" style="font-size:.8rem">${esc(q.topic)} · answer ${q.answer.map(a => LETTERS[q.options.findIndex(o => o.id === a)]).join(", ")} · ${q.sources.length} source(s)</div></div>
    <button class="btn sm" data-act="edit-q" data-i="${k}">Edit</button><button class="btn sm danger" data-act="del-q" data-i="${k}" aria-label="Delete question ${k + 1}">✕</button></div>`).join("");
  return `<div class="row between" style="margin-bottom:12px"><h1>Edit deck</h1><button class="btn sm" data-act="nav" data-view="decks">← Done</button></div>
    <div class="card"><form id="deckMetaForm">
      <div class="field"><label for="dTitle">Deck title</label><input id="dTitle" type="text" value="${esc(d.title)}" required></div>
      <div class="field"><label for="dCourse">${esc(BRAND.courseWord)} (${esc(BRAND.courseExample)})</label><input id="dCourse" type="text" value="${esc(d.course)}"></div>
      <div class="field"><label for="dDesc">Description</label><input id="dDesc" type="text" value="${esc(d.description)}"></div>
      <button class="btn primary" type="submit">Save details</button></form></div>
    <div class="card" style="margin-top:14px"><div class="row between"><h2>Questions (${d.questions.length})</h2><button class="btn sm primary" data-act="edit-q" data-i="-1">+ Add question</button></div>${rows || `<p class="muted">No questions yet.</p>`}</div>`;
}
function openQuestionForm(i) {
  const d = S.decks.find(x => x.id === S.editDeckId);
  const q = i >= 0 ? d.questions[i] : {topic: d.questions[d.questions.length - 1]?.topic || "General", prompt: "", options: [{id: "a", text: ""}, {id: "b", text: ""}, {id: "c", text: ""}, {id: "d", text: ""}], answer: [], explanation: "", sources: [], hint: "", tags: []};
  const optRows = q.options.map((o, k) => optRow(k, o.text, q.answer.includes(o.id))).join("");
  openModal(`<h2>${i >= 0 ? "Edit" : "Add"} question</h2><form id="qForm" data-i="${i}">
    <div class="field"><label for="qTopic">Topic / chapter</label><input id="qTopic" type="text" value="${esc(q.topic)}"></div>
    <div class="field"><label for="qPrompt">Question (scenario + stem)</label><textarea id="qPrompt" required>${esc(q.prompt)}</textarea></div>
    <label>Answer choices <span class="muted">(check every correct answer)</span></label><div id="optRows">${optRows}</div>
    <button type="button" class="btn sm" data-act="add-opt">+ Add choice</button>
    <div class="field" style="margin-top:12px"><label for="qExp">Explanation</label><textarea id="qExp">${esc(q.explanation)}</textarea></div>
    <div class="field"><label for="qSrc">Sources (one per line)</label><textarea id="qSrc" style="min-height:70px">${esc(q.sources.join("\n"))}</textarea></div>
    <div class="field"><label for="qHint">Hint (optional)</label><input id="qHint" type="text" value="${esc(q.hint)}"></div>
    <div class="field"><label for="qTags">Tags (comma separated, e.g., weak-spot)</label><input id="qTags" type="text" value="${esc((q.tags || []).join(", "))}"></div>
    <div class="actions"><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Save question</button></div></form>`, {wide: true});
}
const optRow = (k, text = "", ok = false) => `<div class="row opt-row" style="margin-bottom:8px;flex-wrap:nowrap"><input type="checkbox" class="optOk" ${ok ? "checked" : ""} aria-label="Choice ${LETTERS[k]} is correct" style="width:22px;height:22px;flex:none"><strong style="width:18px">${LETTERS[k]}</strong><input type="text" class="optText" value="${esc(text)}" placeholder="Choice ${LETTERS[k]}"><button type="button" class="btn sm ghost" data-act="rm-opt" aria-label="Remove choice">✕</button></div>`;
async function saveQuestionForm(form) {
  const d = S.decks.find(x => x.id === S.editDeckId), i = +form.dataset.i;
  const rows = [...form.querySelectorAll(".opt-row")].map(r => ({text: r.querySelector(".optText").value.trim(), ok: r.querySelector(".optOk").checked})).filter(r => r.text);
  if (rows.length < 2) { toast("Add at least two answer choices.", true); return; }
  if (!rows.some(r => r.ok)) { toast("Check the correct answer.", true); return; }
  const options = rows.map((r, k) => ({id: LETTERS[k].toLowerCase(), text: r.text}));
  const q = {id: i >= 0 ? d.questions[i].id : uid("q"), topic: $("#qTopic").value.trim() || "General", prompt: $("#qPrompt").value.trim(), options,
    answer: rows.map((r, k) => r.ok ? options[k].id : null).filter(Boolean), explanation: $("#qExp").value.trim(),
    sources: $("#qSrc").value.split("\n").map(s => s.trim()).filter(Boolean), hint: $("#qHint").value.trim(), tags: $("#qTags").value.split(",").map(s => s.trim()).filter(Boolean)};
  if (!q.prompt) { toast("Enter the question text.", true); return; }
  if (i >= 0) d.questions[i] = q; else d.questions.push(q);
  await saveDeck(d); closeModal(); render(); toast("Question saved.");
}

/* ============ IMPORT ============ */
const AI_PROMPT = `You are a warm, careful Bible teacher writing quiz questions for [AGE GROUP] (for example: Little Learners ages 5–8, Kids 9–12, or Teens & Adults). Using the attached or pasted lesson, Bible passage, or curriculum, write [NUMBER] multiple-choice questions about [STORY OR BOOK].

Rules:
- Stay faithful to the biblical text. Use the King James Version (KJV) for any quotations and quote it word for word. Never invent or paraphrase inside quotation marks.
- Every question cites its passage in "sources" as "KJV: Book Chapter:Verse" (for example "KJV: Genesis 9:13"). Add a short exact KJV quote after the reference when helpful.
- Ages 5–8: short, simple sentences; 3 answer choices (a–c); a kind, encouraging explanation of 1–2 sentences; a "hint" on every question.
- Ages 9–12: 4 choices (a–d); explanations of 2–3 sentences; include a hint.
- Teens & Adults: 4 choices; add context, cross-references, and real-life application; make wrong answers plausible (e.g., quotes or events from other parts of the Bible).
- Wrong answers must be clearly wrong from the text, never silly or unkind, and never a different Bible teaching that could also be right.
- Spread the correct answers evenly across the choices.
- "topic": the part of the Bible (for example "Genesis", "Exodus to Ruth", "Kings & Prophets", "Life of Jesus", "Parables of Jesus", "Early Church").
- Stay non-denominational: focus on what the text says.

Return ONLY valid JSON (no commentary) in exactly this format:

async function importDecks(decks, sourceLabel) {
  let n = 0, qn = 0;
  for (const d of decks) { if (!d.questions.length) continue; await saveDeck(d); n++; qn += d.questions.length; }
  if (!n) throw new Error("No valid questions were found. Each question needs a prompt, 2+ choices, and a correct answer.");
  toast(`Imported ${n} deck${n > 1 ? "s" : ""} (${qn} questions)${sourceLabel ? " from " + sourceLabel : ""}.`);
  S.view = "decks"; render();
}
async function handleImportFiles(files) {
  const all = [];
  for (const f of files) {
    try {
      if (/\.(pdf|docx?|pptx?|xlsx?|png|jpe?g|gif|webp|heic|mp4|mov|m4a|mp3|wav|epub)$/i.test(f.name)) { toast(`${f.name} is study material, not a quiz file. Add it in Library, or use AI Builder to turn it into questions.`, true, 5000); continue; }
      all.push(...parseAny(await readAs(f, "text"), f.name));
    } catch (e) { toast(`${f.name}: ${e.message}`, true, 6000); }
  }
  if (all.length) try { await importDecks(all, files.length === 1 ? files[0].name : files.length + " files"); } catch (e) { toast(e.message, true, 6000); }
}
function bindDrop(el) {
  const kind = el.dataset.kind || "import";
  ["dragenter","dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("over"); }));
  el.addEventListener("drop", e => { const fs = [...e.dataTransfer.files]; if (!fs.length) return; kind === "library" ? addLibraryFiles(fs) : kind === "ai" ? addAIFiles(fs) : handleImportFiles(fs); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
}
const isTouch = matchMedia("(pointer: coarse)").matches || /iPhone|iPad|Android/i.test(navigator.userAgent);
function pickFiles(accept, cb) { const inp = $("#hiddenFile"); inp.value = ""; inp.accept = accept || ""; inp.onchange = () => cb([...inp.files]); inp.click(); }

/* ============ ONE-TAP IMPORT LINKS ============ */
// Link format: https://…/index.html#import=<base64url of gzip(deck JSON)>
// Everything after "#" stays on the device (browsers never send it to the server), so a
// private deck can travel inside the link itself without being published anywhere.
async function importFromLink(payload, fromAddressBar = true) {
  if (fromAddressBar) history.replaceState(null, "", location.pathname + location.search);   // clear the link so a refresh won't re-import
  try {
    payload = decodeURIComponent(String(payload)).replace(/[^A-Za-z0-9_\-+/=]/g, "");
    const b64 = payload.replace(/-/g, "+").replace(/_/g, "/"), bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    let text;
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
      if (typeof DecompressionStream === "undefined") throw new Error("this browser is too old to open import links. Update it, or use Import → paste instead");
      text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    } else text = new TextDecoder().decode(bytes);
    const decks = parseAny(text, "Shared deck.json");
    const dupes = decks.filter(d => S.decks.some(x => x.title === d.title && x.questions.length === d.questions.length));
    if (dupes.length && !(await confirmBox("Already imported", `“${esc(dupes[0].title)}” is already in your decks. Import another copy?`, "Import again"))) { toast("Kept your existing deck."); render(); return; }
    await importDecks(decks, "link");
    if (!fromAddressBar) { const pb = $("#pasteBox"); if (pb) pb.value = ""; }
  } catch (e) { const cut = /atob|decod|JSON|gzip|incorrect|invalid/i.test(e.message); toast(cut ? "That link looks incomplete, so part of it was probably cut off when it was copied. Copy the whole link again and paste it." : "Couldn’t import that link: " + e.message, true, 9000); }
}
// Pasted text may be a whole import link (…#import=…). Home Screen apps keep their own storage, so pasting is how a link reaches them.
const linkPayload = t => { const m = String(t).match(/#import=([A-Za-z0-9_\-%+/=\s]+)/); return m ? m[1].replace(/\s+/g, "") : null; };
async function importPastedText(t) {
  if (!t || !t.trim()) { toast("Nothing to import. Copy a deck link or deck text first.", true); return; }
  const lp = linkPayload(t); if (lp) return importFromLink(lp, false);
  try { await importDecks(parseAny(t, ""), "pasted text"); } catch (e) { toast(e.message, true, 7000); }
}
