 (public domain)"]}, "questions": [{"id": "kids1", "topic": "Genesis", "prompt": "God took Abram outside at night and made him a promise about his future family. What did God compare it to?", "options": [{"id": "a", "text": "The trees in a forest"}, {"id": "b", "text": "The stars in the sky"}, {"id": "c", "text": "The fish in the sea"}, {"id": "d", "text": "The mountains of the earth"}], "answer": "b", "explanation": "God told Abram to look toward heaven and count the stars, and said his descendants would be that many. Abram believed God.", "sources": ["KJV: Genesis 15:5–6"], "tags": ["kids"], "hint": "Look up at night."}, {"id": "kids2", "topic": "Genesis", "prompt": "Joseph's brothers sold him into slavery. Years later he became a ruler in Egypt and saved them from famine. What did Joseph tell his brothers?", "options": [{"id": "a", "text": "I will never forgive you"}, {"id": "b", "text": "You must become my servants"}, {"id": "c", "text": "Go home, I don't need you"}, {"id": "d", "text": "You meant it for evil, but God meant it for good"}], "answer": "d", "explanation": "Joseph forgave his brothers and saw God's plan in all of it. God turned something bad into something that saved many lives.", "sources": ["KJV: Genesis 50:20 — \"But as for you, ye thought evil against me; but God meant it unto good...\"", "Genesis 45:5"], "tags": ["kids"], "hint": "Joseph forgave them."}, {"id": "kids3", "topic": "Exodus to Ruth", "prompt": "How many plagues did God send on Egypt before Pharaoh let the Israelites go?", "options": [{"id": "a", "text": "Ten"}, {"id": "b", "text": "Three"}, {"id": "c", "text": "Seven"}, {"id": "d", "text": "Twelve"}], "answer": "a", "explanation": "There were ten plagues, from water turning to blood to the death of the firstborn. God protected Israel through the first Passover.", "sources": ["KJV: Exodus 7:14–12:32"], "tags": ["kids"], "hint": "Count your fingers."}, {"id": "kids4", "topic": "Exodus to Ruth", "prompt": "Where did God give Moses the Ten Commandments?", "options": [{"id": "a", "text": "Mount Carmel"}, {"id": "b", "text": "Mount of Olives"}, {"id": "c", "text": "Mount Sinai"}, {"id": "d", "text": "Mount Ararat"}], "answer": "c", "explanation": "God gave the Ten Commandments on Mount Sinai, written on tables of stone. Mount Carmel is where Elijah prayed, Ararat is where the ark rested, and the Mount of Olives is where Jesus often prayed.", "sources": ["KJV: Exodus 19:20; 20:1–17; 31:18", "Genesis 8:4; 1 Kings 18:19; Luke 22:39"], "tags": ["kids"], "hint": "Starts with S."}, {"id": "kids5", "topic": "Exodus to Ruth", "prompt": "Pharaoh's army chased the Israelites to the edge of the Red Sea. How did God make a way?", "options": [{"id": "a", "text": "He sent boats"}, {"id": "b", "text": "He froze the sea into ice"}, {"id": "c", "text": "He parted the waters so they walked on dry ground"}, {"id": "d", "text": "He built a bridge overnight"}], "answer": "c", "explanation": "Moses stretched out his hand, and the LORD divided the waters. Israel walked through on dry ground!", "sources": ["KJV: Exodus 14:21–22"], "tags": ["kids"], "hint": "Walls of water."}, {"id": "kids6", "topic": "Exodus to Ruth", "prompt": "God told Gideon his army was too big, so no one could boast that they won by their own strength. How many soldiers did God use to win?", "options": [{"id": "a", "text": "300"}, {"id": "b", "text": "3,000"}, {"id": "c", "text": "32,000"}, {"id": "d", "text": "12"}], "answer": "a", "explanation": "Gideon started with 32,000 men, then 10,000, and God chose just 300. The victory clearly belonged to God.", "sources": ["KJV: Judges 7:2–7"], "tags": ["kids"], "hint": "A small number."}, {"id": "kids7", "topic": "Exodus to Ruth", "prompt": "Samson was set apart to God as a Nazarite from birth. What part of his vow was connected to his great strength?", "options": [{"id": "a", "text": "Never eating bread"}, {"id": "b", "text": "Always wearing a gold ring"}, {"id": "c", "text": "Never leaving his hometown"}, {"id": "d", "text": "Never cutting his hair"}], "answer": "d", "explanation": "No razor was to touch Samson's head. When he told Delilah his secret and his hair was cut, the LORD departed from him. His strength came from God.", "sources": ["KJV: Judges 13:5; 16:17–20, 28"], "tags": ["kids"], "hint": "Think of a haircut."}, {"id": "kids8", "topic": "Exodus to Ruth", "prompt": "After her husband died, Ruth chose to stay with her mother-in-law, Naomi. What did Ruth promise?", "options": [{"id": "a", "text": "I will go back to my own people"}, {"id": "b", "text": "Where you go, I will go; your God will be my God"}, {"id": "c", "text": "I will stay only until harvest"}, {"id": "d", "text": "I will find you a home and then leave"}], "answer": "b", "explanation": "Ruth's loyal love became part of God's big plan. She became the great-grandmother of King David!", "sources": ["KJV: Ruth 1:16 — \"...whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God.\"", "Ruth 4:17"], "tags": ["kids"], "hint": "She stayed loyal."}, {"id": "kids9", "topic": "Kings & Prophets", "prompt": "When Samuel went to choose a new king from Jesse's sons, God said He doesn't look at the outside. What does God look at?", "options": [{"id": "a", "text": "The heart"}, {"id": "b", "text": "Height and strength"}, {"id": "c", "text": "Fine clothes"}, {"id": "d", "text": "Age"}], "answer": "a", "explanation": "God chose David, the youngest son, a shepherd boy. People look on the outward appearance, but God looks on the heart.", "sources": ["KJV: 1 Samuel 16:7 — \"...for man looketh on the outward appearance, but the LORD looketh on the heart.\"", "1 Samuel 16:11–13"], "tags": ["kids"], "hint": "It's on the inside."}, {"id": "kids10", "topic": "Kings & Prophets", "prompt": "Elijah challenged the prophets of Baal on Mount Carmel. How did God show He is the true God?", "options": [{"id": "a", "text": "He made it snow on the mountain"}, {"id": "b", "text": "He caused an earthquake"}, {"id": "c", "text": "He sent fire from heaven that burned up the sacrifice, even though it was soaked with water"}, {"id": "d", "text": "He sent a flood"}], "answer": "c", "explanation": "Baal's prophets cried out all day with no answer. Elijah prayed once, and the fire of the LORD fell. The people said, \"The LORD, he is the God.\"", "sources": ["KJV: 1 Kings 18:25–39"], "tags": ["kids"], "hint": "Something hot came down."}, {"id": "kids11", "topic": "Kings & Prophets", "prompt": "Queen Esther learned her people were in danger. Mordecai said she may have become queen \"for such a time as this.\" What did Esther do?", "options": [{"id": "a", "text": "Ran away from the palace"}, {"id": "b", "text": "Bravely went to the king to ask him to save her people"}, {"id": "c", "text": "Kept quiet to stay safe"}, {"id": "d", "text": "Wrote a letter and never spoke to the king"}], "answer": "b", "explanation": "Esther asked everyone to fast, then went to the king even though it could cost her life. She said, \"If I perish, I perish.\" God used her to save her people.", "sources": ["KJV: Esther 4:14 — \"...who knoweth whether thou art come to the kingdom for such a time as this?\"", "Esther 4:16; 7:3"], "tags": ["kids"], "hint": "She was brave."}, {"id": "kids12", "topic": "Kings & Prophets", "prompt": "Shadrach, Meshach, and Abednego refused to bow to the king's golden statue. What did King Nebuchadnezzar see in the fiery furnace?", "options": [{"id": "a", "text": "Only ashes"}, {"id": "b", "text": "The three men crying for help"}, {"id": "c", "text": "The fire going out by itself"}, {"id": "d", "text": "Four men walking in the fire, unhurt"}], "answer": "d", "explanation": "The king saw four men walking in the fire with no hurt! God was with them, and not even the smell of fire was on them.", "sources": ["KJV: Daniel 3:25 — \"Lo, I see four men loose, walking in the midst of the fire, and they have no hurt...\"", "Daniel 3:27"], "tags": ["kids"], "hint": "Count again!"}, {"id": "kids13", "topic": "Kings & Prophets", "prompt": "Nehemiah led the people to rebuild something broken in Jerusalem, even while enemies mocked them. What did they rebuild?", "options": [{"id": "a", "text": "The king's palace"}, {"id": "b", "text": "Noah's ark"}, {"id": "c", "text": "The Tower of Babel"}, {"id": "d", "text": "The city walls"}], "answer": "d", "explanation": "The people had a mind to work and finished the wall in just 52 days. They prayed and kept building!", "sources": ["KJV: Nehemiah 2:17; 4:6; 6:15"], "tags": ["kids"], "hint": "It goes around a city."}, {"id": "kids14", "topic": "Life of Jesus", "prompt": "Who baptized Jesus in the Jordan River?", "options": [{"id": "a", "text": "Peter"}, {"id": "b", "text": "John the Baptist"}, {"id": "c", "text": "Moses"}, {"id": "d", "text": "Paul"}], "answer": "b", "explanation": "When John baptized Jesus, the Spirit came down like a dove, and a voice from heaven said, \"This is my beloved Son, in whom I am well pleased.\"", "sources": ["KJV: Matthew 3:13–17"], "tags": ["kids"], "hint": "His name is in the answer."}, {"id": "kids15", "topic": "Life of Jesus", "prompt": "What was Jesus' first miracle, at a wedding in Cana?", "options": [{"id": "a", "text": "Healing a blind man"}, {"id": "b", "text": "Walking on water"}, {"id": "c", "text": "Turning water into wine"}, {"id": "d", "text": "Feeding 5,000 people"}], "answer": "c", "explanation": "John calls this the \"beginning of miracles.\" Jesus turned water into wine when the wedding ran out.", "sources": ["KJV: John 2:1–11"], "tags": ["kids"], "hint": "It happened at a party."}, {"id": "kids16", "topic": "Parables of Jesus", "prompt": "In the parable of the prodigal son, the younger son wasted his money and came home ashamed. What did the father do when he saw him coming?", "options": [{"id": "a", "text": "Ran to him, hugged him, and threw a party"}, {"id": "b", "text": "Made him a servant forever"}, {"id": "c", "text": "Locked the door"}, {"id": "d", "text": "Sent him away"}], "answer": "a", "explanation": "The son planned to ask to be a hired servant, but the father ran to him, kissed him, and celebrated. This shows how God welcomes us back.", "sources": ["KJV: Luke 15:18–24"], "tags": ["kids"], "hint": "The father was full of love."}, {"id": "kids17", "topic": "Life of Jesus", "prompt": "Peter stepped out of the boat and walked on the water toward Jesus. Why did he start to sink?", "options": [{"id": "a", "text": "He was carrying heavy nets"}, {"id": "b", "text": "Jesus told him to go back"}, {"id": "c", "text": "He saw the strong wind and became afraid"}, {"id": "d", "text": "The boat pulled him back"}], "answer": "c", "explanation": "When Peter looked at the wind instead of Jesus, he got scared and began to sink. Jesus caught him and asked why he doubted.", "sources": ["KJV: Matthew 14:28–31"], "tags": ["kids"], "hint": "Where did he look?"}, {"id": "kids18", "topic": "Life of Jesus", "prompt": "At the Last Supper, Jesus did a servant's job to teach His disciples. What did He do?", "options": [{"id": "a", "text": "Cooked all the food"}, {"id": "b", "text": "Cleaned the house"}, {"id": "c", "text": "Carried their bags"}, {"id": "d", "text": "Washed their feet"}], "answer": "d", "explanation": "Jesus washed His disciples' feet and told them to serve one another the same way.", "sources": ["KJV: John 13:4–5, 14–15"], "tags": ["kids"], "hint": "It involves water and a towel."}, {"id": "kids19", "topic": "Early Church", "prompt": "Saul was hurting Christians until something happened on the road to Damascus. What happened?", "options": [{"id": "a", "text": "A bright light from heaven shone, and Jesus spoke to him"}, {"id": "b", "text": "He fell off a camel and changed his mind"}, {"id": "c", "text": "An earthquake split the road"}, {"id": "d", "text": "A king ordered him to stop"}], "answer": "a", "explanation": "Jesus spoke to Saul from heaven. Saul was blind for three days, then believed and became Paul, who shared the gospel everywhere.", "sources": ["KJV: Acts 9:3–9, 17–20", "Acts 13:9"], "tags": ["kids"], "hint": "Very bright!"}, {"id": "kids20", "topic": "Early Church", "prompt": "On the day of Pentecost, the disciples were together. What came upon them?", "options": [{"id": "a", "text": "A heavy snowstorm"}, {"id": "b", "text": "The Holy Spirit, with a sound like wind and tongues like fire"}, {"id": "c", "text": "Roman soldiers"}, {"id": "d", "text": "A great famine"}], "answer": "b", "explanation": "The Holy Spirit filled them, and they spoke in other languages. About 3,000 people believed that day!", "sources": ["KJV: Acts 2:1–4, 41"], "tags": ["kids"], "hint": "Wind and fire."}]}, {"format": "studyquiz/v1", "deck": {"title": "Teens & Adults: Bible Stories Deep Dive", "course": "Teens & Adults", "description": "20 deeper questions on context, cross-references, and application.", "sources": ["The Holy Bible, King James Version (public domain)"]}, "questions": [{"id": "teens1", "topic": "Genesis", "prompt": "After Cain killed Abel, God asked him where his brother was. Cain answered with a question that still challenges us today. What was it?", "options": [{"id": "a", "text": "\"What is truth?\""}, {"id": "b", "text": "\"Who is my neighbour?\""}, {"id": "c", "text": "\"Am I my brother's keeper?\""}, {"id": "d", "text": "\"Why art thou cast down, O my soul?\""}], "answer": "c", "explanation": "Cain's answer dodged responsibility. The other questions come from Pilate (John 18:38), a lawyer testing Jesus (Luke 10:29), and the psalmist (Psalm 42:5).", "sources": ["KJV: Genesis 4:9", "John 18:38; Luke 10:29; Psalm 42:5"], "tags": ["teens"], "hint": "Genesis 4."}, {"id": "teens2", "topic": "Genesis", "prompt": "When Abraham was tested on Mount Moriah, what did God provide in place of Isaac, and what did Abraham name the place?", "options": [{"id": "a", "text": "A ram caught in a thicket; Jehovah-jireh (\"the LORD will provide\")"}, {"id": "b", "text": "A lamb from a shepherd; El Shaddai"}, {"id": "c", "text": "A dove from heaven; Jehovah-nissi"}, {"id": "d", "text": "An angel's offering; Bethel"}], "answer": "a", "explanation": "God provided a ram, and Abraham named the place Jehovahjireh (KJV spelling). Jehovah-nissi was Moses' altar (Exodus 17:15), and Bethel was Jacob's naming (Genesis 28:19).", "sources": ["KJV: Genesis 22:13–14", "Exodus 17:15; Genesis 28:19"], "tags": ["teens"], "hint": "It was caught by its horns."}, {"id": "teens3", "topic": "Genesis", "prompt": "After wrestling through the night, Jacob received a new name. What was it?", "options": [{"id": "a", "text": "Abraham"}, {"id": "b", "text": "Israel"}, {"id": "c", "text": "Peter"}, {"id": "d", "text": "Judah"}], "answer": "b", "explanation": "God renamed Jacob \"Israel,\" because he had power with God and with men and prevailed. Abram became Abraham (Genesis 17:5), and Simon was surnamed Peter (Mark 3:16).", "sources": ["KJV: Genesis 32:28 — \"Thy name shall be called no more Jacob, but Israel...\"", "Genesis 17:5; Mark 3:16"], "tags": ["teens"], "hint": "A nation bears this name."}, {"id": "teens4", "topic": "Exodus to Ruth", "prompt": "At the burning bush, Moses told God he was \"slow of speech.\" How did God respond?", "options": [{"id": "a", "text": "He chose Joshua instead"}, {"id": "b", "text": "He instantly made Moses a great speaker"}, {"id": "c", "text": "He told Moses to wait forty more years"}, {"id": "d", "text": "He reminded Moses who made man's mouth, and appointed Aaron to speak alongside him"}], "answer": "d", "explanation": "God asked, \"Who hath made man's mouth?\" He promised to be with Moses and sent his brother Aaron as a spokesman. God equips the people He calls.", "sources": ["KJV: Exodus 4:10–16"], "tags": ["teens"], "hint": "Moses' brother."}, {"id": "teens5", "topic": "Exodus to Ruth", "prompt": "Twelve spies explored Canaan. Ten said Israel could not win against the giants. Which two urged the people to trust God?", "options": [{"id": "a", "text": "Aaron and Hur"}, {"id": "b", "text": "Moses and Miriam"}, {"id": "c", "text": "Eleazar and Phinehas"}, {"id": "d", "text": "Joshua and Caleb"}], "answer": "d", "explanation": "Because the people believed the fearful report, that generation wandered forty years. Of that generation, only Joshua and Caleb entered the land.", "sources": ["KJV: Numbers 13:30–33; 14:6–9, 29–30, 33–34"], "tags": ["teens"], "hint": "One later led Israel."}, {"id": "teens6", "topic": "Exodus to Ruth", "prompt": "A teen is nervous about starting at a new school where she won't know anyone. Which promise God gave Joshua fits her situation best?", "options": [{"id": "a", "text": "\"Vanity of vanities; all is vanity.\""}, {"id": "b", "text": "\"Be strong and of a good courage... for the LORD thy God is with thee whithersoever thou goest.\""}, {"id": "c", "text": "\"Eye for eye, tooth for tooth.\""}, {"id": "d", "text": "\"Soul, thou hast much goods laid up for many years; take thine ease.\""}], "answer": "b", "explanation": "God promised Joshua His presence everywhere he went. That's the promise for new, scary places. The distractors come from Ecclesiastes 1:2, Exodus 21:24, and the rich fool in Luke 12:19.", "sources": ["KJV: Joshua 1:9 — \"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.\""], "tags": ["teens"], "hint": "Joshua 1."}, {"id": "teens7", "topic": "Kings & Prophets", "prompt": "After David's sin with Bathsheba, Nathan told a story about a rich man who took a poor man's only lamb. When David grew angry at the rich man, what did Nathan say?", "options": [{"id": "a", "text": "\"Thou art the man.\""}, {"id": "b", "text": "\"Go in peace.\""}, {"id": "c", "text": "\"Repent ye: for the kingdom of heaven is at hand.\""}, {"id": "d", "text": "\"Choose you this day whom ye will serve.\""}], "answer": "a", "explanation": "Nathan's parable made David condemn his own sin. David confessed, and Psalm 51 records his prayer of repentance.", "sources": ["KJV: 2 Samuel 12:1–7, 13", "Psalm 51"], "tags": ["teens"], "hint": "Four words."}, {"id": "teens8", "topic": "Kings & Prophets", "prompt": "When God told young King Solomon to ask for anything, what did Solomon request?", "options": [{"id": "a", "text": "Long life"}, {"id": "b", "text": "Riches and honour"}, {"id": "c", "text": "An understanding heart to judge the people and discern between good and bad"}, {"id": "d", "text": "Victory over his enemies"}], "answer": "c", "explanation": "God was pleased and gave Solomon wisdom, plus riches and honour he didn't ask for.", "sources": ["KJV: 1 Kings 3:5, 9–13"], "tags": ["teens"], "hint": "Not money."}, {"id": "teens9", "topic": "Kings & Prophets", "prompt": "After his victory on Mount Carmel, Elijah fled in fear and asked to die. How did God speak to him on Mount Horeb?", "options": [{"id": "a", "text": "Through a thunderous earthquake"}, {"id": "b", "text": "In a still small voice, after the wind, earthquake, and fire"}, {"id": "c", "text": "From a burning bush"}, {"id": "d", "text": "In a dream about a ladder"}], "answer": "b", "explanation": "God first cared for Elijah with food and rest under the juniper tree, then spoke in a still small voice. The burning bush was Moses, and the ladder was Jacob.", "sources": ["KJV: 1 Kings 19:4–8, 11–12", "Exodus 3:2; Genesis 28:12"], "tags": ["teens"], "hint": "Quiet, not loud."}, {"id": "teens10", "topic": "Kings & Prophets", "prompt": "After Nineveh repented and God spared the city, how did Jonah react?", "options": [{"id": "a", "text": "He celebrated with the people"}, {"id": "b", "text": "He moved to Nineveh to teach them"}, {"id": "c", "text": "He wrote a psalm of praise"}, {"id": "d", "text": "He was angry, because he knew God was gracious and merciful"}], "answer": "d", "explanation": "Jonah admitted he ran because he knew God is gracious and slow to anger. The book ends with God's question about His compassion for Nineveh.", "sources": ["KJV: Jonah 4:1–2, 11"], "tags": ["teens"], "hint": "Jonah 4."}, {"id": "teens11", "topic": "Kings & Prophets", "prompt": "After losing his children and possessions in one day, what did Job say?", "options": [{"id": "a", "text": "\"Curse God, and die.\""}, {"id": "b", "text": "\"I will never trust again.\""}, {"id": "c", "text": "\"The LORD gave, and the LORD hath taken away; blessed be the name of the LORD.\""}, {"id": "d", "text": "\"The LORD is my shepherd; I shall not want.\""}], "answer": "c", "explanation": "Job worshipped even in grief and did not sin or charge God foolishly. \"Curse God, and die\" was his wife's advice (Job 2:9), and Psalm 23 is David's.", "sources": ["KJV: Job 1:20–22", "Job 2:9; Psalm 23:1"], "tags": ["teens"], "hint": "Job 1."}, {"id": "teens12", "topic": "Kings & Prophets", "prompt": "As a young captive in Babylon, Daniel \"purposed in his heart\" not to defile himself with the king's meat and wine. What did he ask for instead, and what happened?", "options": [{"id": "a", "text": "Pulse (vegetables) and water; after ten days he and his friends looked healthier than the others"}, {"id": "b", "text": "Bread only; he became weak"}, {"id": "c", "text": "A forty-day fast; the king released him"}, {"id": "d", "text": "Fish and honey; he was punished"}], "answer": "a", "explanation": "Daniel's respectful request became a test, and God honored his faithfulness in small daily choices.", "sources": ["KJV: Daniel 1:8, 12–15"], "tags": ["teens"], "hint": "Ten days."}, {"id": "teens13", "topic": "Life of Jesus", "prompt": "Two friends in a youth group are arguing, and a third student helps them make peace. Which Beatitude describes the helper?", "options": [{"id": "a", "text": "\"Blessed are the peacemakers: for they shall be called the children of God.\""}, {"id": "b", "text": "\"Blessed are the meek: for they shall inherit the earth.\""}, {"id": "c", "text": "\"Blessed are they that mourn: for they shall be comforted.\""}, {"id": "d", "text": "\"Blessed are the merciful: for they shall obtain mercy.\""}], "answer": "a", "explanation": "Peacemakers reflect their heavenly Father. The other Beatitudes (Matthew 5:4, 5, 7) are true too, but they describe different qualities.", "sources": ["KJV: Matthew 5:9", "Matthew 5:3–12"], "tags": ["teens"], "hint": "Making peace."}, {"id": "teens14", "topic": "Parables of Jesus", "prompt": "In the parable of the talents, why was the third servant rebuked?", "options": [{"id": "a", "text": "He spent the money on himself"}, {"id": "b", "text": "He gave it to the poor"}, {"id": "c", "text": "He was afraid and hid his talent in the earth instead of putting it to use"}, {"id": "d", "text": "He doubled it but kept it secret"}], "answer": "c", "explanation": "The faithful servants heard, \"Well done, thou good and faithful servant.\" Faithful stewardship means using what God entrusts to us, not burying it.", "sources": ["KJV: Matthew 25:14–30 (esp. 25:21, 25–28)"], "tags": ["teens"], "hint": "Fear kept him still."}, {"id": "teens15", "topic": "Life of Jesus", "prompt": "A lawyer asked Jesus which is the great commandment in the law. Jesus answered with two. Which pair is correct?", "options": [{"id": "a", "text": "Keep the Sabbath; honour your father and mother"}, {"id": "b", "text": "Do not steal; do not lie"}, {"id": "c", "text": "Give a tenth; pray without ceasing"}, {"id": "d", "text": "Love God with all your heart, soul, and mind; and love your neighbour as yourself"}], "answer": "d", "explanation": "Jesus said all the law and the prophets hang on these two commandments.", "sources": ["KJV: Matthew 22:35–40 — \"Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind... Thou shalt love thy neighbour as thyself.\""], "tags": ["teens"], "hint": "Both are about love."}, {"id": "teens16", "topic": "Life of Jesus", "prompt": "Martha was busy serving while her sister Mary sat at Jesus' feet listening. When Martha complained, what did Jesus say?", "options": [{"id": "a", "text": "\"Mary, go and help your sister.\""}, {"id": "b", "text": "\"Mary hath chosen that good part, which shall not be taken away from her.\""}, {"id": "c", "text": "\"You both should leave.\""}, {"id": "d", "text": "\"Serving is more important than listening.\""}], "answer": "b", "explanation": "Jesus gently told Martha she was careful and troubled about many things, but one thing was needful: time with Him.", "sources": ["KJV: Luke 10:38–42"], "tags": ["teens"], "hint": "Luke 10:42."}, {"id": "teens17", "topic": "Life of Jesus", "prompt": "Peter denied knowing Jesus three times. After the resurrection, how did Jesus restore him?", "options": [{"id": "a", "text": "He made Peter wait a year to rejoin"}, {"id": "b", "text": "He sent Peter away from the other disciples"}, {"id": "c", "text": "He never brought it up"}, {"id": "d", "text": "He asked Peter three times, \"Lovest thou me?\" and told him to feed His sheep"}], "answer": "d", "explanation": "Three denials were answered with three chances to affirm his love, along with a new calling. That's grace in action.", "sources": ["KJV: John 21:15–17", "Luke 22:54–62"], "tags": ["teens"], "hint": "Three questions."}, {"id": "teens18", "topic": "Life of Jesus", "prompt": "Two disciples walked to Emmaus with the risen Jesus but didn't recognize Him. When were their eyes opened?", "options": [{"id": "a", "text": "When He took bread, blessed it, and broke it"}, {"id": "b", "text": "When He showed them the nail prints"}, {"id": "c", "text": "When they reached the Temple"}, {"id": "d", "text": "When an angel told them"}], "answer": "a", "explanation": "They knew Him in the breaking of bread. Showing His hands and side happened with the disciples and Thomas (John 20:20, 27).", "sources": ["KJV: Luke 24:13–16, 30–31, 35", "John 20:20, 27"], "tags": ["teens"], "hint": "At the table."}, {"id": "teens19", "topic": "Early Church", "pr async function unzip(buf) {

  }

    const e = entries.find(x => x.name === name); if (!e) return null;
    const l = e.lho, data = new Uint8Array(buf, l + 30 + dv.getUint16(l + 26, true) + dv.getUint16(l + 28, true), e.csize);
    if (e.method === 0) return td.decode(data);
    if (typeof DecompressionStream === "undefined") throw new Error("this browser can't unzip Office files; update it or save as PDF/text");
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(); return td.decode(out);
  }};
}
const xmlText = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
async function extractOffice(blob, name) {
  const z = await unzip(await blob.arrayBuffer()), n = name.toLowerCase();
  if (n.endsWith(".docx")) {
    const x = await z.read("word/document.xml") || "";
    return xmlText(x.replace(/<w:tab\/>/g, "\t").replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")).replace(/\n{3,}/g, "\n\n").trim();
  }
  if (n.endsWith(".pptx")) {
    const slides = z.names.filter(s => /^ppt\/slides\/slide\d+\.xml$/.test(s)).sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]); let out = "";
    for (const s of slides) { const x = await z.read(s); const texts = [...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]); out += `## Slide ${s.match(/\d+/)[0]}\n${xmlText(texts.join(" "))}\n\n`; }
    return out.trim();
  }

    const ss = await z.read("xl/sharedStrings.xml"); const shared = ss ? [...ss.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m => xmlText([...m[1].matchAll(/<t[^>]*>([^<]*)<\/t>/g)].map(t => t[1]).join(""))) : [];

    for (const s of sheets) {
      const x = await z.read(s); out += `## ${s.match(/sheet\d+/)[0]}\n`;
      for (const row of x.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)) {
        const cells = [...row[1].matchAll(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)].map(c => { const v = (c[2] || "").match(/<v>([^<]*)<\/v>/)?.[1] ?? (c[2] || "").match(/<t[^>]*>([^<]*)<\/t>/)?.[1] ?? ""; return /t="s"/.test(c[1]) ? shared[+v] ?? "" : xmlText(v); });
        out += cells.join(" | ") + "\n";
      }
      out += "\n";
    }
    return out.trim();
  }
  throw new Error("unsupported Office format (use .docx, .pptx, or .xlsx)");
}

    : p.kind === "image" ? {type: "image_url", image_url: {url: `data:${p.mime};base64,${p.b64}`}} : {type: "text", text: `=== ${p.name} ===\n${p.text}`});
  content.push({type: "text", text: prompt});
  const headers = {"content-type": "application/json"}; if (key) headers.authorization = "Bearer " + key;
  const r = await fetch(base + "/chat/completions", {method: "POST", headers, body: JSON.stringify({model, messages: [{role: "user", content: prov === "custom" && parts.every(p => p.kind === "text") ? content.map(c => c.text).join("\n\n") : content}]})});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error?.message || `API error ${r.status}`);
  return j.choices?.[0]?.message?.content || "";
}
async function aiGenerate(btn) {
  saveAISettings();
  const status = $("#aiStatus"), set = m => status.textContent = m;
  const total = Math.max(3, Math.min(100, +$("#aiCount").value || 20)), title = $("#aiTitle").value.trim(), focus = $("#aiFocus").value.trim(), scenario = $("#aiScenario").checked;
  const libIds = [...document.querySelectorAll(".aiLib:checked")].map(c => c.value); const libFiles = [];
  for (const id of libIds) { const f = await DB.get("files", id); if (f) libFiles.push(f); }
  const files = [...AI_FILES, ...libFiles];
  if (!files.length && !$("#aiText").value.trim()) { toast("Add at least one file or paste some text.", true); return; }
  btn.disabled = true; set("Reading your files…");
  try {
    const {parts, notes} = await prepareMaterials(files, $("#aiText").value, S.settings.provider);
    notes.forEach(n => toast(n, true, 6000));
    if (!parts.length) throw new Error("None of the materials could be sent. See the messages above.");
    const batch = 15; let deck = null;
    while ((deck?.questions.length || 0) < total) {
      const need = Math.min(batch, total - (deck?.questions.length || 0));
      set(`Writing questions ${(deck?.questions.length || 0) + 1}–${(deck?.questions.length || 0) + need} of ${total}… (about 1–2 minutes per batch)`);
      const text = await callAI(parts, genPrompt(need, title, focus, scenario, deck ? deck.questions.map(q => q.prompt) : []));
      const [d] = parseAny(text, (title || "AI deck") + ".json");
      if (!d.questions.length) throw new Error("The AI reply didn't contain usable questions. Try again or use fewer files.");
      if (!deck) deck = d; else d.questions.forEach(q => { q.id = uid("q"); deck.questions.push(q); });
      if (d.questions.length < need / 2) break;
    }
    if (title) { deck.title = title + (/exam|quiz|practice/i.test(title) ? "" : " Quiz"); deck.course ||= title; }
    await saveDeck(deck); AI_FILES = [];
    set(`Done. Created “${deck.title}” with ${deck.questions.length} questions.`); toast("Deck created. Review it in Edit questions before relying on it.");
    S.view = "decks"; render();
  } catch (e) {
    const msg = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Couldn't reach the AI service. Check your internet connection, API base URL, and that the local server allows browser (CORS) requests." : e.message;
    set("Error: " + msg); toast(msg, true, 7000);
  } finally { btn.disabled = false; }
}

/* ============ SETTINGS ============ */
function renderSettings() {
  const st = S.settings, ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone, fileMode = location.protocol === "file:";
  return `<h1>Settings</h1>
  <div class="card"><h2>Install for offline use</h2>
    ${standalone ? `<p class="pill ok">Installed ✓ and works offline.</p>` : fileMode
      ? `<p>You're running the <strong>single-file version</strong>. Keep this HTML file on your computer and open it any time, even offline. Export a backup now and then (below), because some browsers limit storage for local files.</p><p class="help">To install on iPhone or Android, open the hosted version (see the guide) and add it to your home screen.</p>`
      : ios ? `<p>On iPhone or iPad: tap <strong>Share</strong> (the square with an arrow) → <strong>Add to Home Screen</strong>. Open it once while online, and it works offline after that.</p>`
      : S.deferredInstall ? `<button class="btn primary" data-act="install">Install app</button>` : `<p>In Chrome or Edge, use the browser menu → <strong>Install app</strong>, or <strong>Add to Home screen</strong> on Android. Once opened, it works offline.</p>`}
  </div>
  <div class="card" style="margin-top:14px"><h2>Study preferences</h2>
    <div class="row" style="align-items:flex-start">
      <div class="field" style="flex:1;min-width:160px"><label for="stSec">Exam seconds per question</label><input id="stSec" type="number" min="10" value="${st.secPerQ}"></div>
      <div class="field" style="flex:1;min-width:160px"><label for="stPass">Target score %</label><input id="stPass" type="number" min="1" max="100" value="${st.passPct}"></div>
      <div class="field" style="flex:1;min-width:160px"><label for="stTheme">Theme</label><select id="stTheme">${["auto","light","dark"].map(t => `<option ${st.theme === t ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>
    <label class="check"><input type="checkbox" id="stShufQ" ${st.shuffleQ ? "checked" : ""}> Shuffle question order by default</label>
    <label class="check"><input type="checkbox" id="stShufO" ${st.shuffleOpts ? "checked" : ""}> Shuffle answer choices by default</label>
  </div>
  <div class="card" style="margin-top:14px"><h2>Branding</h2><p class="help">Rename the app for your church, class, or family (for example, "Grace Kids Bible Quiz"). Leave blank to keep the defaults.</p>
    <div class="field"><label for="stName">App name</label><input id="stName" type="text" placeholder="${esc(BRAND.name)}" value="${esc(st.appName)}"></div>
    <div class="field"><label for="stTag">Tagline</label><input id="stTag" type="text" placeholder="${esc(BRAND.tagline)}" value="${esc(st.tagline)}"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn primary" data-act="save-settings">Save settings</button></div>
  <div class="card" style="margin-top:14px"><h2>Backup & restore</h2><p class="muted">Your decks, progress, and library live only on this device. Export a backup to move them to another device or keep them safe.</p>
    <label class="check"><input type="checkbox" id="bkFiles"> Include library files (can be large)</label>
    <div class="row"><button class="btn" data-act="backup">Export backup</button><button class="btn" data-act="restore">Restore backup</button><button class="btn danger" data-act="wipe">Erase all data</button></div></div>
  <div class="card" style="margin-top:14px"><h2>About</h2><p>${esc(st.appName || BRAND.name)} v${BRAND.version} · ${esc(BRAND.byline)}<br><a href="${esc(BRAND.url)}" target="_blank" rel="noopener">${esc(BRAND.url.replace(/^https?:\/\//, ""))}</a> · <a href="mailto:${esc(BRAND.support)}">${esc(BRAND.support)}</a></p>
    <p class="help">No accounts, no tracking. Nothing leaves your device except files you choose to send to an AI in AI Builder.</p></div>`;
}
async function doBackup() {
  const withFiles = $("#bkFiles")?.checked; toast("Preparing backup…");
  const data = {format: "faithful-study-backup", version: 1, exported: new Date().toISOString(), decks: S.decks, progress: Object.values(S.progress), settings: {...S.settings, apiKey: ""}, files: []};
  if (withFiles) for (const f of await DB.all("files")) data.files.push({...f, blob: undefined, buf: undefined, data: abToB64(await fileBlob(f).arrayBuffer())});
  download(`faithful-study-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data));
}
async function doRestore(file) {
  try {
    const data = JSON.parse(await readAs(file, "text"));
    if (data.format !== "faithful-study-backup") { const decks = parseAny(JSON.stringify(data), file.name); await importDecks(decks, file.name); return; }
    if (!(await confirmBox("Restore backup?", `This adds ${data.decks.length} deck(s) and ${data.files?.length || 0} file(s). Decks with the same ID are replaced.`, "Restore"))) return;
    for (const d of data.decks) await DB.put("decks", d);
    for (const p of data.progress || []) await DB.put("progress", p);
    for (const f of data.files || []) { const bin = atob(f.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); await DB.put("files", {...f, data: undefined, blob: undefined, buf: u.buffer}); }
    if (data.settings) { S.settings = {...S.settings, ...data.settings, apiKey: S.settings.apiKey}; await saveSettings(); }
    await loadAll(); applyBrand(); toast("Backup restored."); S.view = "decks"; render();
  } catch (e) { toast("Restore failed: " + e.message, true, 6000); }
}

/* ============ PRINT ============ */
function printDeck(d) {
  const w = window.open("", "_blank"); if (!w) { toast("Allow pop-ups to print.", true); return; }
  const qs = d.questions.map((q, k) => `<div style="break-inside:avoid;margin-bottom:16px"><p><strong>${k + 1}.</strong> ${esc(q.prompt).replace(/\n/g, "<br>")}</p><ol type="A">${q.options.map(o => `<li>${esc(o.text)}</li>`).join("")}</ol></div>`).join("");
  const key = d.questions.map((q, k) => `<div style="break-inside:avoid;margin-bottom:12px"><p><strong>${k + 1}. ${q.answer.map(a => LETTERS[q.options.findIndex(o => o.id === a)]).join(", ")}</strong>: ${esc(q.explanation)}</p>${q.sources.length ? `<p style="font-size:12px"><em>Sources:</em> ${q.sources.map(esc).join("; ")}</p>` : ""}</div>`).join("");
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#111}h1{font-size:20px}h2{page-break-before:always}</style></head><body><h1>${esc(d.title)}</h1><p>${esc(d.course)} · ${d.questions.length} questions</p>${qs}<h2>Answer key</h2>${key}<script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ============ EVENTS ============ */
const actions = {
  "nav": (ds, el, e) => { e.preventDefault(); nav(ds.view); },
  "modal-bg": (ds, el, e) => { if (e.target === el) closeModal(false); },
  "modal-close": ds => closeModal(ds.val === "1"),
  "menu": (ds, el) => { const l = el.nextElementSibling; const open = l.classList.contains("hide"); document.querySelectorAll(".menu-list").forEach(m => m.classList.add("hide")); document.querySelectorAll("[data-act=menu]").forEach(b => b.setAttribute("aria-expanded", "false")); if (open) { l.classList.remove("hide"); el.setAttribute("aria-expanded", "true"); l.querySelector("button")?.focus(); } },
  "load-sample": async () => { await importDecks(parseJSONDeck(SAMPLE), "sample"); },
  "setup": ds => openSetup(ds.id, ds.mode),
  "weak": ds => { const d = S.decks.find(x => x.id === ds.id); if (d && !d.questions.some(q => isWeak(d.id, q))) { toast("No weak spots right now. Keep practicing!"); return; } openSetup(ds.id, "practice", true); },
  "pick": ds => pick(ds.opt),
  "check": () => checkAnswer(),
  "next": () => move(1), "prev": () => move(-1),
  "hint": () => { const s = S.session; s.hints[s.qs[s.i].id] = true; render(); },
  "speak": () => speakQ(S.session.qs[S.session.i]),
  "speak-exp": () => { const q = S.session.qs[S.session.i]; speakText((isCorrect(q, S.session.ans[q.id]) ? BRAND.correctMsg + " " : "") + q.explanation); },
  "speak-flash": () => { const s = S.session, q = s.qs[s.i]; if (s.flipped) speakText(q.answer.map(a => q.options.find(o => o.id === a).text).join(". ") + ". " + q.explanation); else speakQ(q); },
  "flag": () => { const s = S.session, q = s.qs[s.i]; s.flags[q.id] = !s.flags[q.id]; render(); },
  "exam-grid": () => examGrid(),
  "goto": ds => { closeModal(); S.session.i = +ds.i; render(); },
  "submit-exam": () => submitExam(),
  "end-practice": () => finishSession(),
  "rfilter": ds => { S.lastResult.filter = ds.f; render(); },
  "flip": () => { S.session.flipped = !S.session.flipped; $(".flash")?.classList.toggle("flipped", S.session.flipped); },
  "flash-rate": ds => flashRate(ds.ok === "1"),
  "stats": ds => { S.statsDeckId = ds.id; nav("stats"); },
  "edit-deck": ds => { S.editDeckId = ds.id; nav("editor"); },
  "new-deck": async () => { const d = {id: uid("deck"), title: "New deck", course: "", description: "", sources: [], questions: [], created: Date.now()}; await saveDeck(d); S.editDeckId = d.id; nav("editor"); },
  "edit-q": ds => openQuestionForm(+ds.i),
  "del-q": async ds => { const d = S.decks.find(x => x.id === S.editDeckId); if (await confirmBox("Delete question?", "This can't be undone.", "Delete", true)) { d.questions.splice(+ds.i, 1); await saveDeck(d); render(); } },
  "add-opt": () => { const box = $("#optRows"), k = box.children.length; if (k >= 10) return; box.insertAdjacentHTML("beforeend", optRow(k)); },
  "rm-opt": (ds, el) => { const box = $("#optRows"); if (box.children.length <= 2) return; el.closest(".opt-row").remove(); [...box.children].forEach((r, k) => { r.querySelector("strong").textContent = LETTERS[k]; r.querySelector(".optText").placeholder = "Choice " + LETTERS[k]; }); },
  "export-json": ds => { const d = S.decks.find(x => x.id === ds.id); download(slug(d.title) + ".json", deckToJSON(d)); },
  "export-csv": ds => { const d = S.decks.find(x => x.id === ds.id); download(slug(d.title) + ".csv", "﻿" + deckToCSV(d), "text/csv"); },
  "print-deck": ds => printDeck(S.decks.find(x => x.id === ds.id)),
  "dup-deck": async ds => { const d = S.decks.find(x => x.id === ds.id); const c = JSON.parse(JSON.stringify(d)); c.id = uid("deck"); c.title += " (copy)"; await saveDeck(c); render(); toast("Deck duplicated."); },
  "reset-prog": async ds => { if (await confirmBox("Reset progress?", "Clears mastery, weak spots, and history for this deck. The questions stay.", "Reset", true)) { S.progress[ds.id] = {id: ds.id, q: {}, attempts: []}; await saveProg(ds.id); render(); } },
  "del-deck": async ds => { const d = S.decks.find(x => x.id === ds.id); if (await confirmBox("Delete deck?", `“${esc(d.title)}” and its progress will be permanently deleted. Export it first if you might want it later.`, "Delete", true)) { await DB.del("decks", d.id); await DB.del("progress", d.id); S.decks = S.decks.filter(x => x.id !== d.id); delete S.progress[d.id]; render(); toast("Deck deleted."); } },
  "pick-import": () => pickFiles(isTouch ? "" : ".json,.csv,.tsv,.txt,.md,application/json,text/*", handleImportFiles),
  "import-paste": async () => importPastedText($("#pasteBox").value),
  "import-clipboard": async () => {
    let t = "";
    try { t = await navigator.clipboard.readText(); } catch (e) { toast("Your browser didn’t allow reading the clipboard. Long-press the box above, tap Paste, then tap Import pasted text.", true, 8000); $("#pasteBox")?.focus(); return; }
    importPastedText(t);
  },
  "copy-prompt": async () => { try { await navigator.clipboard.writeText(AI_PROMPT); toast("Prompt copied. Paste it into any AI with your files attached."); } catch (e) { download("ai-quiz-prompt.txt", AI_PROMPT, "text/plain"); } },
  "dl-prompt": () => download("ai-quiz-prompt.txt", AI_PROMPT, "text/plain"),
  "pick-lib": () => pickFiles("", addLibraryFiles),
  "open-file": ds => openFile(ds.id),
  "dl-file": async ds => { const f = await DB.get("files", ds.id); if (f) download(f.name, fileBlob(f)); },
  "del-file": async ds => { const f = await DB.get("files", ds.id); if (f && await confirmBox("Delete file?", `Remove “${esc(f.name)}” from this device?`, "Delete", true)) { await DB.del("files", ds.id); render(); } },
  "new-note": () => openModal(`<h2>New note</h2><form id="noteForm"><div class="field"><label for="nTitle">Title</label><input id="nTitle" type="text" required></div><div class="field"><label for="nBody">Note</label><textarea id="nBody" style="min-height:220px"></textarea></div><div class="actions"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">Save note</button></div></form>`),
  "persist": async () => { if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); toast(ok ? "Storage protected. The browser won't auto-delete your data." : "The browser declined. Install the app to the home screen for better protection, and keep backups.", !ok, 5000); } else toast("This browser doesn't support that. Keep backups instead.", true); },
  "pick-ai": () => pickFiles(".pdf,.docx,.pptx,.xlsx,.csv,.tsv,.txt,.md,.json,.html,image/*", addAIFiles),
  "ai-rm": ds => { AI_FILES.splice(+ds.i, 1); $("#aiFileList").innerHTML = aiFileListHtml(); },
  "ai-generate": (ds, el) => aiGenerate(el),
  "save-settings": async () => { const st = S.settings; st.secPerQ = Math.max(10, +$("#stSec").value || 90); st.passPct = Math.min(100, Math.max(1, +$("#stPass").value || 80)); st.theme = $("#stTheme").value; st.shuffleQ = $("#stShufQ").checked; st.shuffleOpts = $("#stShufO").checked; st.appName = $("#stName").value.trim(); st.tagline = $("#stTag").value.trim(); await saveSettings(); applyBrand(); toast("Settings saved."); },
  "backup": () => doBackup(),
  "restore": () => pickFiles(isTouch ? "" : ".json,application/json", fs => fs[0] && doRestore(fs[0])),
  "wipe": async () => { if (await confirmBox("Erase everything?", "Deletes all decks, progress, library files, and settings on this device. Export a backup first if you might need anything.", "Erase all", true)) { for (const s of ["decks","progress","files","kv"]) await DB.clear(s); await loadAll(); applyBrand(); nav("decks"); toast("All data erased."); } },
  "install": async () => { if (S.deferredInstall) { S.deferredInstall.prompt(); await S.deferredInstall.userChoice; S.deferredInstall = null; render(); } }
};
document.addEventListener("click", e => {
  if (!e.target.closest(".menu")) document.querySelectorAll(".menu-list").forEach(m => m.classList.add("hide"));
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.closest(".menu-list")) document.querySelectorAll(".menu-list").forEach(m => m.classList.add("hide"));
  const fn = actions[el.dataset.act]; if (fn) { if (el.dataset.act === "menu" || el.dataset.act.startsWith("pick")) e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "setupForm") startSession(f);
  else if (f.id === "qForm") saveQuestionForm(f);
  else if (f.id === "deckMetaForm") { const d = S.decks.find(x => x.id === S.editDeckId); d.title = $("#dTitle").value.trim() || "Untitled deck"; d.course = $("#dCourse").value.trim(); d.description = $("#dDesc").value.trim(); await saveDeck(d); toast("Deck details saved."); }
  else if (f.id === "noteForm") { const t = $("#nTitle").value.trim() || "Note"; const blob = new Blob([$("#nBody").value], {type: "text/markdown"}); await DB.put("files", {id: uid("file"), name: t.replace(/\.md$/i, "") + ".md", type: "text/markdown", size: blob.size, course: ($("#libCourse")?.value || S.settings.lastCourse || "").trim(), added: Date.now(), buf: await blob.arrayBuffer()}); closeModal(); render(); toast("Note saved."); }
});
document.addEventListener("input", e => { if (e.target.id === "sCount" && $("#sMin")) $("#sMin").value = Math.max(1, Math.ceil((+e.target.value || 1) * S.settings.secPerQ / 60)); });
document.addEventListener("change", e => { if (e.target.id === "aiProv") { S.settings.provider = e.target.value; S.settings.model = ""; S.settings.baseUrl = ""; saveSettings(); render(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modalRoot").innerHTML) { closeModal(false); return; }
  if ($("#modalRoot").innerHTML || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const s = S.session; if (S.view !== "session" || !s) return;
  if (s.mode === "flash") { if (e.key === " " || e.key === "Enter") { e.preventDefault(); actions.flip(); } else if (e.key === "1") flashRate(false); else if (e.key === "2") flashRate(true); return; }
  const q = s.qs[s.i], k = LETTERS.indexOf(e.key.toUpperCase());
  if (k >= 0 && k < q.options.length && !e.metaKey && !e.ctrlKey) { e.preventDefault(); pick(q.options[k].id); }
  else if (e.key === "Enter") { e.preventDefault(); if (s.mode === "practice" && !s.checked[q.id]) checkAnswer(); else if (s.i < s.qs.length - 1) move(1); }
  else if (e.key === "ArrowRight") move(1); else if (e.key === "ArrowLeft") move(-1);
});
new MutationObserver(() => { if (S.view === "session" && S.session?.mode === "flash") requestAnimationFrame(fitFlash); }).observe($("#main"), {childList: true});
window.addEventListener("online", updateNet); window.addEventListener("offline", updateNet);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.deferredInstall = e; if (S.view === "settings") render(); });
window.addEventListener("beforeunload", e => { if (S.session && S.session.mode === "exam" && !S.session.ended) { e.preventDefault(); e.returnValue = ""; } });

/* ============ BOOT ============ */
(async function boot() {
  const ok = await DB.open(); await loadAll(); S.runtimeKey = S.settings.apiKey; applyBrand(); updateNet(); render();
  if (!ok) toast("This browser blocked storage here, so data will be lost when you close this tab. Use Export backup, or install the hosted version.", true, 9000);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (location.hash.startsWith("#import=")) { await importFromLink(location.hash.slice(8)); }
  else if (!S.decks.length && (location.hash === "#sample" || (BRAND.autoSeed && !(await DB.get("kv", "seeded"))))) { await DB.put("kv", {id: "seeded", at: Date.now()}); actions["load-sample"](); }
  // A link tapped while the app is already open only changes the #fragment (no reload), so listen for it too.
  window.addEventListener("hashchange", () => { if (location.hash.startsWith("#import=")) importFromLink(location.hash.slice(8)); });
})();
</script>
